apiVersion: v2
name: orkestra
description: >-
  Kubernetes operators without the infrastructure. A built-in Security Gateway
  enforces deletion protection and namespace protection with admission webhooks.
  Define operators in YAML — the runtime absorbs everything else. Runtime and
  Gateway deploy independently.
type: application
version: 1.7.18
appVersion: "0.7.18"

keywords:
  - orkestra
  - operator
  - kubernetes
  - crd
  - declarative
  - controller
  - gateway
  - webhook
  - admission
  - security
  - deletion-protection
  - controlcenter
  - dashboard
  - observability

home: https://github.com/orkspace/orkestra
sources:
  - https://github.com/orkspace/orkestra

maintainers:
  - name: Orkspace
    email: releases@orkspace.io
    url: https://github.com/orkspace/orkestra

icon: https://raw.githubusercontent.com/orkspace/orkestra/main/documentation/assets/logo.png

annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Deep Insights
  artifacthub.io/images: |
    - name: runtime
      image: ghcr.io/orkspace/orkestra
    - name: gateway
      image: ghcr.io/orkspace/orkestra-gateway
    - name: control-center
      image: ghcr.io/orkspace/orkestra-cc
  artifacthub.io/links: |
    - name: Documentation
      url: https://orkestra.sh
    - name: Why Orkestra?
      url: https://orkestra.sh/blog/why-orkestra
    - name: Control Center Dashboard
      url: https://cc.orkestra.sh
    - name: Orkestra Registry
      url: https://orkestra.sh/docs/reference/orkestra-registry
  artifacthub.io/screenshots: |
    - title: Orkestra Control Center
      url: https://raw.githubusercontent.com/orkspace/orkestra/main/documentation/assets/controlcenter/control-center-landing.png
    - title: CRD Health View
      url: https://raw.githubusercontent.com/orkspace/orkestra/main/documentation/assets/controlcenter/control-panel-website.png
    - title: Metrics Overview
      url: https://raw.githubusercontent.com/orkspace/orkestra/main/documentation/assets/controlcenter/pv-watcher-workers.png
  artifacthub.io/changes: |
    - kind: added
      description: "reconcile.remote: any HTTP server can be the reconcile logic; runtime owns queue, backoff, SSA, owner refs, RBAC, health, and events"
    - kind: added
      description: "operatorBox.runtime.cleanup: declare when to delete a CR after it reaches a terminal state; works for remote, generic, and typed reconcilers"
    - kind: added
      description: "operatorBox.emit.events: declarative Kubernetes Event emission after every reconcile; no reconciler code required"
    - kind: changed
      description: "operatorBox schema regrouped into OPPRE sections (observe, preReconcile, runtime, reconcile, emit); flat layout deprecated with warning"
    - kind: changed
      description: "admission fields (validation, mutation, conversion, webhooks) moved to peer admission: block at CRD level"
    - kind: changed
      description: "pkg/runtime/reconcilers restructured: generic and remote as sub-packages; remote split into http (implemented) and grpc (reserved)"
    - kind: removed
      description: "Provider system removed"
