# Schema reference: https://orkestra.sh/docs/reference/schema/komposer/
apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: <komposer-name>
  author: <your-name>
  version: 0.1.0
  description: <what this composition does>

# ── Sources ──────────────────────────────────────────────────────────────────
# Orkestra merges all sources into one unified operator runtime.
# Later sources win on name conflict — except spec.crds, which always wins.

imports:
  files:
    - ./katalog.yaml               # local Katalog

  # registry:                      # OCI registry (versioned, immutable)
  #   - url: ghcr.io/orkspace/patterns/postgres@v1.0.0
  #     oci: true

  # helm:                          # Helm chart source
  #   - repo: https://github.com/orkspace/charts.git
  #     chart: orkestra-katalog-example
  #     version: v0.1.0

# ── Overrides ────────────────────────────────────────────────────────────────
# Per-CRD tuning that wins over all sources.
# Only override what you need — everything else is inherited from the source.

spec:
  crds:
    <crd-name>:
      operatorBox:
        reconcile:
          workers: 4
          resync: 15s

    # <other-crd>:
    #   dependsOn:
    #     <crd-name>:
    #       condition: healthy     # or: started
