apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: website-intent
  version: 0.1.0
  description: A Website operator that callers reach through the gateway with an intent.

gateway:
  api:
    enabled: true
    auth:
      tokens:
        - name: dev
          token: "${INTENT_TOKEN}"

spec:
  crds:
    website:
      crdFile: ./manifests/crd.yaml
      serve:
        enabled: true
        namespace: default
        # Intent fields the caller may send; each lands on spec.<field>.
        fields:
          image: {}
          replicas: {}
          port: {}
        # What the caller reads back: only this view, not the full CR.
        config:
          response:
            default: false
            payload:
              name: '{{ .metadata.name }}'
              image: '{{ .spec.image }}'
              phase: '{{ .status.phase }}'
              endpoint: '{{ .status.endpoint }}'
            poll:
              field: status.phase
      operatorBox:
        reconcile:
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: "{{ .spec.port }}"
                reconcile: true
            services:
              - name: "{{ .metadata.name }}-svc"
                port: "80"
                targetPort: "{{ .spec.port }}"
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: endpoint
                value: "{{ .metadata.name }}.{{ .metadata.namespace }}.svc.cluster.local"
        runtime:
          allowedNamespaces:
            - default
