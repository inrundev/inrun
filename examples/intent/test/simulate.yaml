apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: website-intent-sim
  description: >
    Reconcile the CR the gateway builds from intent.json. There is no cr.yaml:
    run ork serve play -i intent.json --token dev --simulate=simulate.yaml.

spec:
  katalog: ../katalog.yaml
  cycles: 5

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: apply
        resource: deployments
      - cycle: 1
        verb: apply
        resource: services
