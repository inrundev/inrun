# Schema reference: https://orkestra.sh/docs/reference/schema/katalog/
apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-hooks-only
  author: myorg
  version: 1.0.0
  description: >
    The WebApp operator in hooks-only mode. The hook owns both resources:
    Deployment and Service. No declared templates.
    Use when every resource requires computed values or type-safe control
    that templates cannot express.
  tags:
    - migration
    - hooks
    - typed

spec:
  crds:
    hooksApp:
      apiTypes:
        group: migration.demo.orkestra.io
        version: v1alpha1
        kind: WebApp
        plural: webapps
        object: WebApp
        objectList: WebAppList
        location: github.com/orkspace/from-controller-runtime-demo/api/v1alpha1
        alias: demov1alpha1
      operatorBox:
        runtime:
          allowedNamespaces:
            - default
        # No declared templates. The hook manages both resources.
        reconcile:
          default: true   # Generic Reconciler still runs — hook is additive
          hooks:
            location: github.com/orkspace/from-controller-runtime-demo/hooks
            function: WebAppHooks
            alias: webhooks
            managedResources:
              - kind: Deployment
              - kind: Service
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: endpoint
                value: "{{ .metadata.name }}-svc.{{ .metadata.namespace }}.svc.cluster.local"
              - path: replicas
                value: "{{ .spec.replicas }}"
