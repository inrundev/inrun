# Schema reference: https://orkestra.sh/docs/reference/schema/katalog/
apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-constructor
  author: myorg
  version: 1.0.0
  description: >
    The WebApp operator with a full constructor. Go owns the reconcile loop.
    Same behaviour as the controller-runtime baseline — the difference is what
    Orkestra handles so you don't have to.
  tags:
    - migration
    - constructor
    - typed

spec:
  crds:
    constructorApp:
      apiTypes:
        group: migration.demo.orkestra.io
        version: v1alpha1
        kind: WebApp
        plural: webapps
        object: WebApp
        objectList: WebAppList
        location: github.com/orkspace/from-controller-runtime-demo/api/v1alpha1
        alias: demov1alpha1
      operatorBox:
        runtime:
          allowedNamespaces:
            - default
        reconcile:
          # default: false — the GenericReconciler is not used.
          # The constructor below owns the full reconcile loop.
          default: false
          constructor:
            location: github.com/orkspace/from-controller-runtime-demo/reconciler
            function: NewWebAppReconciler
            managedResources:
              - kind: Deployment
              - kind: Service
