# Schema reference: https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: webapp-declarative-e2e
  description: Verify the declarative operator creates a Deployment and Service and writes status for a WebApp CR

spec:
  katalog: ./katalog.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  cluster:
    provider: kind
    name: ork-e2e
    reuse: false

  expect:
    - name: WebApp CR created
      after: cr-applied
      timeout: 30s
      resources:
        - kind: WebApp
          name: my-webapp
          namespace: default

    - name: Status written
      after: cr-applied
      timeout: 60s
      commands:
        - run: kubectl get webapp my-webapp -o jsonpath='{.status.phase}'
          outputContains: Running

    - name: Deployment and Service created
      after: cr-applied
      timeout: 90s
      resources:
        - kind: Deployment
          name: my-webapp
          namespace: default
          ready: true
        - kind: Service
          name: my-webapp-svc
          namespace: default

    - name: Cleanup verified
      after: cr-deleted
      timeout: 30s
      resources:
        - kind: WebApp
          name: my-webapp
          namespace: default
          count: 0
        - kind: Deployment
          name: my-webapp
          namespace: default
          count: 0
        - kind: Service
          name: my-webapp-svc
          namespace: default
          count: 0
