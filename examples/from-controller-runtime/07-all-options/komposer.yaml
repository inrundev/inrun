apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: webapp-all-options
  author: myorg
  version: 1.0.0
  description: >
    All five WebApp migration options running in one Orkestra runtime.
    Each option manages its own CRD and CR. The Komposer imports all five
    katalogs and unifies them into a single binary.

    This is the practical answer to: "Which option should I choose?"
    All five are available. Pick the one that fits your team.
imports:
  registry:
    - oci://ghcr.io/myorg/katalogs/webapp-declarative:1.0.0
    - oci://ghcr.io/myorg/katalogs/webapp-hooks:1.0.0
    - oci://ghcr.io/myorg/katalogs/webapp-hooks-only:1.0.0
    - oci://ghcr.io/myorg/katalogs/webapp-constructor:1.0.0
    - oci://ghcr.io/myorg/katalogs/webapp-constructor-ork:1.0.0
spec:
  crds:
    declarativeApp:
      apiTypes:
        group: allopt.demo.orkestra.io
        version: v1alpha1
        kind: DeclarativeApp
        plural: declarativeapps
      operatorBox:
        reconcile:
          workers: 3

    hybridApp:
      apiTypes:
        group: allopt.demo.orkestra.io
        version: v1alpha1
        kind: HybridApp
        plural: hybridapps
      dependsOn:
        declarativeApp:
          condition: started

    hooksApp:
      apiTypes:
        group: allopt.demo.orkestra.io
        version: v1alpha1
        kind: HooksApp
        plural: hooksapps
      dependsOn:
        declarativeApp:
          condition: started

    constructorApp:
      apiTypes:
        group: allopt.demo.orkestra.io
        version: v1alpha1
        kind: ConstructorApp
        plural: constructorapps
      operatorBox:
        reconcile:
          workers: 3

    orkApp:
      apiTypes:
        group: allopt.demo.orkestra.io
        version: v1alpha1
        kind: OrkApp
        plural: orkapps
      operatorBox:
        reconcile:
          workers: 3
