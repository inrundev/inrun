# Schema reference: https://orkestra.sh/docs/reference/schema/katalog/
apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-constructor-ork
  author: myorg
  version: 1.0.0
  description: >
    The WebApp constructor using Orkestra's pkg/resources library.
    Same as 04-constructor-migration but with Get/IsNotFound/Create/Patch
    replaced by orkdeploy.Update and orksvc.Update. Owner references,
    idempotency, and system labels are handled automatically.
  tags:
    - migration
    - constructor
    - typed

spec:
  crds:
    orkApp:
      apiTypes:
        group: allopt.demo.orkestra.io
        version: v1alpha1
        kind: OrkApp
        plural: orkapps
        object: OrkApp
        objectList: OrkAppList
        location: github.com/orkspace/from-controller-runtime-all-options/options/ork-resources/api/v1alpha1
        alias: orkv1alpha1
      operatorBox:
        reconcile:
          # default: false — the GenericReconciler is not used.
          # The constructor below owns the full reconcile loop.
          default: false
          constructor:
            location: github.com/orkspace/from-controller-runtime-all-options/options/ork-resources/reconciler
            function: NewWebAppReconciler
            managedResources:
              - kind: Deployment
              - kind: Service
        runtime:
          allowedNamespaces:
            - default

