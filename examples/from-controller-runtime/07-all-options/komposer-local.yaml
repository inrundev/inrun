apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: webapp-all-options
  author: myorg
  version: 1.0.0
  description: >
    All five WebApp migration options running in one Orkestra runtime.
    Local development version — katalogs are imported from local paths.
    See komposer.yaml for the OCI version after publishing.

imports:
  files:
    - ./options/declarative/katalog.yaml
    - ./options/hybrid/katalog.yaml
    - ./options/hooks/katalog.yaml
    - ./options/constructor/katalog.yaml
    - ./options/ork-resources/katalog.yaml

spec:
  crds:
    declarativeApp:
      operatorBox:
        reconcile:
          workers: 3

    hybridApp:
      dependsOn:
        declarativeApp:
          condition: started

    hooksApp:
      dependsOn:
        declarativeApp:
          condition: started

    constructorApp:
      operatorBox:
        reconcile:
          workers: 3

    orkApp:
      operatorBox:
        reconcile:
          workers: 3
