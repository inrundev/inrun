# Schema reference: https://orkestra.sh/docs/reference/schema/simulate/
apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: webapp-hooks-sim
  description: >
    Verify the declarative Deployment and hook-created Service both appear in cycle 1

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: apply
        resource: deployments
      - cycle: 1
        verb: apply
        resource: services
