# Schema reference: https://orkestra.sh/docs/reference/schema/katalog/
apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-remote
  author: myorg
  version: 1.0.0
  description: >
    The WebApp operator as a remote HTTP reconciler.
    The reconciler is a bash script — no Go, no image build, no Kubernetes SDK.
    Orkestra owns the queue, backoff, informer, owner references, SSA, and health.
    The script owns the Deployment and Service specs.
  tags:
    - beginner
    - migration
    - remote

notes:
  functions:
    - name: reconcilerEndpoint
      description: Remote reconciler HTTP endpoint — in-cluster Service or local dev server
      expression: >
        {{ if .ork.inCluster }}
          http://webapp-reconciler.default.svc.cluster.local:8025/reconcile
        {{ else }}
          http://localhost:8025/reconcile
        {{ end }}

spec:
  crds:
    webapp:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      setup:
        - ./secret.yaml
      operatorBox:
        reconcile:
          default: false
          remote:
            endpoint: "{{ reconcilerEndpoint }}"
            timeout: 15s
            args:
              logLevel: info
              environment: '{{ .metadata.labels.environment | default "development" }}'
              appName: "{{ .metadata.name }}"
            auth:
              secretRef:
                name: webapp-reconciler-token
                namespace: default
                key: token
            payload:
              object:
                exclude:
                  - metadata.managedFields
            managedResources:
              - group: apps
                plural: deployments
              - group: ""
                plural: services
        runtime:
          allowedNamespaces:
            - default
