# Schema reference: https://orkestra.sh/docs/reference/schema/simulate/
apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: webapp-all-options-sim
  description: >
    Run simulate for all five migration options in one pass —
    declarative, hybrid, hooks-only, constructor, and Orkestra resources.

imports:
  - ./options/declarative/simulate.yaml
  - ./options/hybrid/simulate.yaml
  - ./options/hooks/simulate.yaml
  - ./options/constructor/simulate.yaml
  - ./options/ork-resources/simulate.yaml
