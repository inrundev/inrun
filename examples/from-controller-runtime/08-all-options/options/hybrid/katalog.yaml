# Schema reference: https://orkestra.sh/docs/reference/schema/katalog/
apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-hooks
  author: myorg
  version: 1.0.0
  description: >
    The WebApp operator in hybrid mode. The Deployment is declared in the Katalog.
    The Service is created by a Go hook. Both run inside the same Orkestra reconcile loop.
  tags:
    - migration
    - hooks
    - typed

spec:
  crds:
    hybridApp:
      apiTypes:
        group: allopt.demo.orkestra.io
        version: v1alpha1
        kind: HybridApp
        plural: hybridapps
        object: HybridApp
        objectList: HybridAppList
        location: github.com/orkspace/from-controller-runtime-all-options/options/hybrid/api/v1alpha1
        alias: hybridv1alpha1
      operatorBox:
        reconcile:
          default: true   # GenericReconciler still runs — hook is additive
          hooks:
            location: github.com/orkspace/from-controller-runtime-all-options/options/hybrid/hooks
            function: WebAppHooks
            alias: webhooks
            runHooksFirst: true
            managedResources:
              - kind: Service
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: "{{ .spec.port }}"
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: endpoint
                value: "{{ .metadata.name }}-svc.{{ .metadata.namespace }}.svc.cluster.local"
              - path: replicas
                value: "{{ .spec.replicas }}"
        runtime:
          allowedNamespaces:
            - default
        # Declared resources — Orkestra creates and drift-corrects these.
        # The hook creates the Service with type-safe access to obj.Spec.Port.

