# Schema reference: https://orkestra.sh/docs/reference/schema/katalog/
apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-declarative
  author: myorg
  version: 1.0.0
  description: >
    The WebApp operator expressed fully declaratively. Zero Go.
    Same behaviour as the controller-runtime baseline — Deployment, Service, status.
  tags:
    - beginner
    - migration
    - declarative

spec:
  crds:
    declarativeApp:
      apiTypes:
        group: allopt.demo.orkestra.io
        version: v1alpha1
        kind: DeclarativeApp
        plural: declarativeapps
      operatorBox:
        reconcile:
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: "{{ .spec.port }}"
                reconcile: true

            services:
              - name: "{{ .metadata.name }}-svc"
                port: "80"
                targetPort: "{{ .spec.port }}"
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: endpoint
                value: "{{ .metadata.name }}-svc.{{ .metadata.namespace }}.svc.cluster.local"
              - path: replicas
                value: "{{ .spec.replicas }}"
        runtime:
          allowedNamespaces:
            - default

