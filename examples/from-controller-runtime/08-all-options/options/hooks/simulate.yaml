# Schema reference: https://orkestra.sh/docs/reference/schema/simulate/
apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: webapp-hooks-only-sim
  description: >
    Verify both resources — Deployment and Service —
    are created by the hook on cycle 1.

spec:
  katalog: ./katalog.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: apply
        resource: deployments
      - cycle: 1
        verb: apply
        resource: services
