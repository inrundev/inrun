# Schema reference: https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: webapp-all-options-e2e
  description: >
    Full e2e suite for all five migration options — each option runs against its
    own CRD and CR in the same cluster, verified in sequence.

imports:
  - ./options/declarative/e2e.yaml
  - path: ./options/hybrid/e2e.yaml
    wait: 30s
  - path: ./options/hooks/e2e.yaml
    wait: 30s
  - path: ./options/constructor/e2e.yaml
    wait: 30s
  - path: ./options/ork-resources/e2e.yaml
    wait: 30s
