# Schema reference: https://orkestra.sh/docs/reference/schema/katalog/
apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-constructor
  author: myorg
  version: 1.0.0
  description: >
    A controller-runtime WebApp reconciler running unchanged in Orkestra.
  tags:
    - migration
    - constructor
    - typed

spec:
  crds:
    constructorApp:
      crdFile: ./manifests/crd.yaml
      crFiles:
        - ./manifests/cr.yaml
      apiTypes:
        object: WebApp
        objectList: WebAppList
        location: github.com/orkspace/from-controller-runtime-demo/api/v1alpha1
        alias: demov1alpha1
      operatorBox:
        runtime:
          allowedNamespaces:
            - default
        reconcile:
          # default: false — the Generic Reconciler is not used.
          # The constructor below owns the full reconcile loop.
          default: false
          constructor:
            location: github.com/orkspace/from-controller-runtime-demo/reconciler
            function: NewWebAppReconciler
            managedResources:
              - kind: Deployment
              - kind: Service
