apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: configmapdistributions.demo.orkestra.io
spec:
  group: demo.orkestra.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [configMapName, sourceNamespace, targetNamespaces]
              properties:
                configMapName:
                  type: string
                  description: Name of the ConfigMap to copy
                sourceNamespace:
                  type: string
                  description: Namespace where the source ConfigMap lives
                targetNamespaces:
                  type: array
                  items:
                    type: string
                  description: Namespaces to copy the ConfigMap into
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  names:
    kind: ConfigMapDistribution
    plural: configmapdistributions
    singular: configmapdistribution
    shortNames:
      - cd
  scope: Cluster  # This is so it can distribute to all namespaces