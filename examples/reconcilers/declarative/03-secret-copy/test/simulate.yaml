apiVersion: orkestra.orkspace.io/v1
kind: Simulate
metadata:
  name: secret-distribution-sim
  description: >
    Demonstrates that ork simulate detects cross-namespace copy operations
    and skips them gracefully. The Secret copy requires a live API server to
    read the source Secret — simulate prints a note and exits cleanly.

spec:
  katalog: ../katalog.yaml
  cr: ../manifests/cr.yaml
  cycles: 1

  expect:
    steady: false
    noErrors: true
