apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: worker-service-operator
  description: >
    Worker service that scales to peak replicas during business hours
    (Mon–Fri 09:00–18:00 UTC) and holds at base replicas otherwise.
    No KEDA, no CronJobs — one autoscale: field.

notes:
  functions:
    - name: inBusinessHours
      description: True during business hours (Mon–Fri 09:00–18:00 UTC)
      expression: '{{ and weekday (timeInWindow "09:00" "18:00") }}'

spec:
  crds:
    workerservice:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 1m
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: 2
                port: "{{ .spec.port | default 8080 }}"
                reconcile: true
                autoscale:
                  min: 2
                  max: 10
                  cooldown: 2m
                  scaleUp:
                    target: 10
                    conditions:
                      when:
                        - dayOfWeek:
                            weekday: true
                        - time:
                            after: "09:00"
                            before: "18:00"
                  scaleDown:
                    target: 2
                    conditions:
                      when:
                        - dayOfWeek:
                            weekday: true
                          negate: true
                        - time:
                            after: "09:00"
                            before: "18:00"
                          negate: true
        emit:
          status:
            fields:
              - path: phase
                value: "Steady"
              - path: phase
                value: "Peak"
                when:
                  - field: "{{ inBusinessHours }}"
                    equals: "true"
              - path: replicas
                value: "{{ readyReplicas .children.deployment }}"

