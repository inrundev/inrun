apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: worker-pool-operator
  description: >
    Worker pool that scales based on live queue depth from an external metrics
    endpoint. When pending jobs exceed 100, the pool scales up by 2 replicas
    per evaluation. When the queue drains below 20, it scales down by 1.
    No KEDA, no ScaledObject — one autoscale: field and one external: call.

spec:
  crds:
    workerpool:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onReconcile:
            external:
              - name: queue
                url: "{{ .spec.metricsEndpoint }}"
                method: GET
                timeout: 5s
                continueOnError: true

            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: 2
                port: "{{ .spec.port | default 8080 }}"
                reconcile: true
                autoscale:
                  min: 2
                  max: 10
                  cooldown: 3m
                  scaleUp:
                    conditions:
                      when:
                        - field: external.queue.queue.pendingJobs
                          greaterThan: "100"
                    increment: 2
                  scaleDown:
                    conditions:
                      when:
                        - field: external.queue.queue.pendingJobs
                          lessThan: "20"
                    decrement: 1
        emit:
          status:
            fields:
              - path: phase
                value: "Steady"
              - path: phase
                value: "Scaling"
                when:
                  - field: external.queue.queue.pendingJobs
                    greaterThan: "100"
              - path: replicas
                value: "{{ readyReplicas .children.deployment }}"
              - path: pendingJobs
                value: "{{ .external.queue.queue.pendingJobs }}"

