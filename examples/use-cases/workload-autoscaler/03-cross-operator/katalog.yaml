apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: job-queue-worker-operator
  description: >
    Two CRDs in one katalog — JobQueue and JobWorker.

    JobQueue manages a queue service and publishes its depth to status.
    JobWorker consumes from the queue and autoscales its Deployment based
    on the queue's live depth, read via the cross: block.

    When queue depth exceeds 100, workers scale up by 2 per evaluation.
    When it drops below 20, workers scale down by 1.
    No KEDA. No external scaler. One cross: declaration.

spec:
  crds:
    # ── JobQueue ──────────────────────────────────────────────────────────────
    # Manages the queue service and publishes queueDepth to status.
    # In a real system this would read from Kafka, RabbitMQ, SQS, etc.
    # Here spec.initialDepth drives the simulated depth for testing.
    jobqueue:
      crdFile: ./crd-queue.yaml
      crFiles:
        - ./cr.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}-queue"
                image: "{{ .spec.image }}"
                replicas: 1
                port: "{{ .spec.port | default 8080 }}"
                reconcile: true
            services:
              - name: "{{ .metadata.name }}-queue"
                port: "{{ .spec.port | default 8080 }}"
                reconcile: true
          onDelete:
            deployments:
              - name: "{{ .metadata.name }}-queue"
            services:
              - name: "{{ .metadata.name }}-queue"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: queueDepth
                value: "{{ .spec.initialDepth | default 0 }}"

    # ── JobWorker ─────────────────────────────────────────────────────────────
    # Reads the named JobQueue's status.queueDepth via cross: and uses it
    # as the scaling signal for its worker Deployment.
    jobworker:
      crdFile: ./crd-worker.yaml
      crFiles:
        - ./cr.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: 2
                port: "{{ .spec.port | default 9090 }}"
                reconcile: true
                autoscale:
                  min: 2
                  max: 10
                  cooldown: 2m
                  scaleUp:
                    conditions:
                      when:
                        - field: cross.queue.status.queueDepth
                          greaterThan: "100"
                    increment: 2
                  scaleDown:
                    conditions:
                      when:
                        - field: cross.queue.status.queueDepth
                          lessThan: "20"
                    decrement: 1
        emit:
          status:
            fields:
              - path: phase
                value: "Steady"
              - path: phase
                value: "Scaling"
                when:
                  - field: cross.queue.status.queueDepth
                    greaterThan: "100"
              - path: replicas
                value: "{{ readyReplicas .children.deployment }}"
              - path: observedQueueDepth
                value: "{{ .cross.queue.status.queueDepth }}"
        observe:
          cross:
            - crd: jobqueue
              selector:
                name: "{{ .spec.queueName }}"
                namespace: "{{ .metadata.namespace }}"
              as: queue

