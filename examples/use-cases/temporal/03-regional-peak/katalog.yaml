apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: cdn-edge-operator
  description: >
    CDN edge operator that scales each region's deployment based on local business hours.
    US-East, EU-Central, and APAC each get peak replicas during their 09:00-17:00 window
    (expressed in UTC) and base replicas the rest of the day.
    No CronJobs, no external schedulers — the reconciler drives convergence on every resync.

notes:
  functions:
    - name: usEastPeak
      description: True during US-East business hours (09:00-17:00 ET = 14:00-22:00 UTC)
      expression: '{{ timeInWindow "14:00" "22:00" }}'

    - name: euCentralPeak
      description: True during EU-Central business hours (09:00-17:00 CET = 08:00-16:00 UTC)
      expression: '{{ timeInWindow "08:00" "16:00" }}'

    - name: apacPeak
      description: True during APAC business hours (09:00-17:00 JST = 00:00-08:00 UTC)
      expression: '{{ timeInWindow "00:00" "08:00" }}'

    - name: usEastReplicas
      description: Replica count for US-East — peak or base depending on current time
      expression: "{{ if usEastPeak }}{{ .spec.peakReplicas | default 8 }}{{ else }}{{ .spec.baseReplicas | default 2 }}{{ end }}"

    - name: euCentralReplicas
      description: Replica count for EU-Central — peak or base depending on current time
      expression: "{{ if euCentralPeak }}{{ .spec.peakReplicas | default 8 }}{{ else }}{{ .spec.baseReplicas | default 2 }}{{ end }}"

    - name: apacReplicas
      description: Replica count for APAC — peak or base depending on current time
      expression: "{{ if apacPeak }}{{ .spec.peakReplicas | default 8 }}{{ else }}{{ .spec.baseReplicas | default 2 }}{{ end }}"

spec:
  crds:
    cdnedge:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 1m
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}-us-east"
                image: "{{ .spec.image }}"
                replicas: "{{ usEastReplicas }}"
                port: 80
                reconcile: true

              - name: "{{ .metadata.name }}-eu-central"
                image: "{{ .spec.image }}"
                replicas: "{{ euCentralReplicas }}"
                port: 80
                reconcile: true

              - name: "{{ .metadata.name }}-apac"
                image: "{{ .spec.image }}"
                replicas: "{{ apacReplicas }}"
                port: 80
                reconcile: true

            configMaps:
              - name: "{{ .metadata.name }}-routing"
                data:
                  usEastPeak: "{{ usEastPeak }}"
                  usEastReplicas: "{{ usEastReplicas }}"
                  euCentralPeak: "{{ euCentralPeak }}"
                  euCentralReplicas: "{{ euCentralReplicas }}"
                  apacPeak: "{{ apacPeak }}"
                  apacReplicas: "{{ apacReplicas }}"
                reconcile: true
          onDelete:
            deployments:
              - name: "{{ .metadata.name }}-us-east"
              - name: "{{ .metadata.name }}-eu-central"
              - name: "{{ .metadata.name }}-apac"
            configMaps:
              - name: "{{ .metadata.name }}-routing"
        emit:
          status:
            fields:
              - path: phase
                value: "Active"
              - path: usEastPeak
                value: "{{ usEastPeak }}"
              - path: euCentralPeak
                value: "{{ euCentralPeak }}"
              - path: apacPeak
                value: "{{ apacPeak }}"
              - path: usEastReplicas
                value: "{{ usEastReplicas }}"
              - path: euCentralReplicas
                value: "{{ euCentralReplicas }}"
              - path: apacReplicas
                value: "{{ apacReplicas }}"

