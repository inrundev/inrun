apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: database-operator
  description: >
    Database operator with a weekly maintenance window (Sun 02:00–04:00 UTC).
    Read replicas scale to zero during the window and restore automatically when
    it closes. The routing ConfigMap signals downstream load balancers.
    No runbook, no human intervention — the operator owns the full lifecycle.

notes:
  functions:
    - name: inMaintenance
      description: True during the weekly maintenance window (Sun 02:00–04:00 UTC)
      expression: '{{ and weekend (timeInWindow "02:00" "04:00") }}'

    - name: nextMaintenance
      description: Next maintenance window start time (RFC3339)
      expression: '{{ nextCron "0 2 * * 0" }}'

    - name: activeReplicas
      description: Desired read-replica count — zero during maintenance, spec value otherwise
      expression: '{{ if inMaintenance }}0{{ else }}{{ .spec.readReplicas | default 2 }}{{ end }}'

spec:
  crds:
    database:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 1m
          onCreate:
            secrets:
              - name: "{{ .metadata.name }}-creds"
                once: true
                data:
                  password: "{{ randomAlphanumeric 24 }}"

            statefulSets:
              - name: "{{ .metadata.name }}-primary"
                image: "{{ .spec.image }}"
                replicas: 2
                port: 5432
                reconcile: true
                env:
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: "{{ .metadata.name }}-creds"
                        key: password

              - name: "{{ .metadata.name }}-replicas"
                image: "{{ .spec.image }}"
                replicas: "{{ activeReplicas }}"
                port: 5432
                reconcile: true
                env:
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: "{{ .metadata.name }}-creds"
                        key: password

            configMaps:
              - name: "{{ .metadata.name }}-routing"
                data:
                  maintenance: "{{ inMaintenance }}"
                  readReplicas: "{{ activeReplicas }}"
                reconcile: true
          onDelete:
            secrets:
              - name: "{{ .metadata.name }}-creds"
            statefulSets:
              - name: "{{ .metadata.name }}-primary"
              - name: "{{ .metadata.name }}-replicas"
            configMaps:
              - name: "{{ .metadata.name }}-routing"
        emit:
          status:
            fields:
              - path: phase
                value: "Ready"
              - path: phase
                value: "Maintenance"
                when:
                  - field: "{{ inMaintenance }}"
                    equals: "true"
              - path: readReplicas
                value: "{{ activeReplicas }}"
              - path: maintenanceActive
                value: "{{ inMaintenance }}"
              - path: nextMaintenance
                value: "{{ nextMaintenance }}"

