apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: dev-environment-operator
  description: >
    Provisions a development environment during business hours (Mon–Fri 09:00–18:00 UTC)
    and deprovisions it automatically when the window closes.
    No CronJobs, no runbooks — the operator owns the lifecycle.

notes:
  functions:
    - name: nextBusinessHour
      description: Next time business hours open (Mon–Fri 09:00 UTC)
      expression: '{{ nextCron "0 9 * * 1-5" }}'

    - name: inBusinessHours
      description: True when it is currently a business day and within the 09:00–18:00 UTC window
      expression: '{{ and weekday (timeInWindow "09:00" "18:00") }}'

spec:
  crds:
    devenvironment:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 1m
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas | default 2 }}"
                port: "{{ .spec.port | default 8080 }}"
                reconcile: true
                when:
                  - time:
                      after: "09:00"
                      before: "18:00"
                  - dayOfWeek:
                      weekday: true

            services:
              - name: "{{ .metadata.name }}-svc"
                port: "{{ .spec.port | default 8080 }}"
                reconcile: true
                when:
                  - time:
                      after: "09:00"
                      before: "18:00"
                  - dayOfWeek:
                      weekday: true
          onDelete:
            deployments:
              - name: "{{ .metadata.name }}"
            services:
              - name: "{{ .metadata.name }}-svc"
        emit:
          status:
            fields:
              - path: phase
                value: "Suspended"
              - path: phase
                value: "Active"
                when:
                  - field: "{{ inBusinessHours }}"
                    equals: "true"
              - path: message
                value: "Suspended — resumes {{ nextBusinessHour }}"
              - path: message
                value: "Environment is running"
                when:
                  - field: "{{ inBusinessHours }}"
                    equals: "true"

