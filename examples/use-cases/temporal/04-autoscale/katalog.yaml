apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: api-server-operator
  description: >
    API server operator that scales replicas up during business hours (Mon–Fri 09:00–18:00 UTC)
    and back down outside them. No CronJobs, no external schedulers — the reconciler drives
    convergence on every resync using the workload autoscaler.

notes:
  functions:
    - name: inBusinessHours
      description: True during business hours (Mon–Fri 09:00–18:00 UTC)
      expression: '{{ and weekday (timeInWindow "09:00" "18:00") }}'

spec:
  crds:
    apiserver:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 1m
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: 2
                port: "{{ .spec.port | default 8080 }}"
                reconcile: true
                autoscale:
                  min: 2
                  max: 8
                  cooldown: 2m
                  scaleUp:
                    target: 8
                    conditions:
                      when:
                        - field: "{{ inBusinessHours }}"
                          equals: "true"
                  scaleDown:
                    target: 2
                    conditions:
                      when:
                        - field: "{{ inBusinessHours }}"
                          equals: "false"                  
        emit:
          status:
            fields:
              - path: phase
                value: "Steady"
              - path: phase
                value: "Peak"
                when:
                  - field: "{{ inBusinessHours }}"
                    equals: "true"
              - path: inBusinessHours
                value: "{{ inBusinessHours }}"
              - path: replicas
                value: "{{ readyReplicas .children.deployment }}"

