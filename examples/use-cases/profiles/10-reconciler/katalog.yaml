apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: service-reconciler-profiles
  description: >
    Profiles 10 — reconciler profiles.
    Declares three reconciler tuning presets in the profiles: block and
    references one from operatorBox.reconciler.profile. The profile expands
    into workers, resync, and queue.maxDepth at validate time — no inline
    values needed at the CRD level.

profiles:
  reconciler:
    - name: api-service
      description: Standard web service — balanced throughput and API server load
      workers: 4
      resync: 30s
      queue:
        maxDepth: 200

    - name: batch-worker
      description: Background processing — fewer workers, infrequent resync
      workers: 2
      resync: 5m
      queue:
        maxDepth: 500

    - name: local-dev
      description: Single worker, fast resync for iterative local development
      workers: 1
      resync: 15s
      queue:
        maxDepth: 50

spec:
  crds:
    service:
      crdFile: ../crd.yaml
      operatorBox:
        reconcile:
          profile: local-dev
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                replicas: "{{ .spec.replicas }}"
                resources:
                  profile: medium
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists
              - path: phase
                value: "Ready"
                when:
                  - field: "{{ allReplicasReady .children.deployments }}"
                    equals: "true"

