apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: service-resourcequota-profiles
  description: >
    Profiles 07 — ResourceQuota profiles.
    Creates four ResourceQuotas from a single CR, each using a different
    built-in tier profile. The profile expands at Katalog load time into a
    fully-formed hard limits map; no pod counts or CPU values to write.

spec:
  crds:
    service:
      crdFile: ../crd.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onCreate:
            resourceQuotas:
              # small — prototype and CI workloads
              - name: "{{ .metadata.name }}-quota-small"
                namespace: "{{ .metadata.namespace }}"
                profile: small
                reconcile: true

              # medium — standard team namespace
              - name: "{{ .metadata.name }}-quota-medium"
                namespace: "{{ .metadata.namespace }}"
                profile: medium
                reconcile: true

              # large — high-traffic or data-intensive namespaces
              - name: "{{ .metadata.name }}-quota-large"
                namespace: "{{ .metadata.namespace }}"
                profile: large
                reconcile: true

              # xlarge — very large or shared platform namespaces
              - name: "{{ .metadata.name }}-quota-xlarge"
                namespace: "{{ .metadata.namespace }}"
                profile: xlarge
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists
              - path: phase
                value: "Ready"
                when:
                  - field: "{{ resourceExists .children.resourceQuotas }}"
                    equals: "true"

