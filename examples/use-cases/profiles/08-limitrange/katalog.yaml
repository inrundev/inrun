apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: service-limitrange-profiles
  description: >
    Profiles 08 — LimitRange profiles (user-defined).
    LimitRange has no built-in presets — the profiles: block is how you name
    your container default policies. Declares three presets and creates one
    LimitRange per profile from a single CR.

profiles:
  limitRanges:
    - name: minimal
      description: Low defaults for CI or ephemeral namespaces
      limits:
        - type: Container
          default:
            cpu: 200m
            memory: 128Mi
          defaultRequest:
            cpu: 50m
            memory: 64Mi
          max:
            cpu: "1"
            memory: 512Mi

    - name: standard
      description: General-purpose defaults for most application namespaces
      limits:
        - type: Container
          default:
            cpu: 500m
            memory: 512Mi
          defaultRequest:
            cpu: 100m
            memory: 128Mi
          max:
            cpu: "2"
            memory: 4Gi

    - name: generous
      description: Higher defaults for workloads with heavier baseline resource needs
      limits:
        - type: Container
          default:
            cpu: "1"
            memory: 2Gi
          defaultRequest:
            cpu: 250m
            memory: 512Mi
          max:
            cpu: "4"
            memory: 8Gi

spec:
  crds:
    service:
      crdFile: ../crd.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onCreate:
            limitRanges:
              # minimal — CI and ephemeral namespaces
              - name: "{{ .metadata.name }}-limits-minimal"
                namespace: "{{ .metadata.namespace }}"
                profile: minimal
                reconcile: true

              # standard — general application namespaces
              - name: "{{ .metadata.name }}-limits-standard"
                namespace: "{{ .metadata.namespace }}"
                profile: standard
                reconcile: true

              # generous — workloads with heavy baseline needs
              - name: "{{ .metadata.name }}-limits-generous"
                namespace: "{{ .metadata.namespace }}"
                profile: generous
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists
              - path: phase
                value: "Ready"
                when:
                  - field: "{{ resourceExists .children.limitRanges }}"
                    equals: "true"

