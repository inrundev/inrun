apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: service-resource-profiles
  description: >
    Profiles 01 — resource profiles.
    Creates one Deployment per resource profile. Each Deployment gets different
    CPU and memory requests/limits from the profile name alone — no explicit
    values needed. Inspect the Deployments to see what each profile expands to.

spec:
  crds:
    service:
      crdFile: ../crd.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}-tiny"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                resources:
                  profile: tiny
                reconcile: true

              - name: "{{ .metadata.name }}-small"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                resources:
                  profile: small
                reconcile: true

              - name: "{{ .metadata.name }}-medium"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                resources:
                  profile: medium
                reconcile: true

              - name: "{{ .metadata.name }}-large"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                resources:
                  profile: large
                reconcile: true

              - name: "{{ .metadata.name }}-burst"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                resources:
                  profile: burst
                reconcile: true

              - name: "{{ .metadata.name }}-steady"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                resources:
                  profile: steady
                reconcile: true

              - name: "{{ .metadata.name }}-compute-heavy"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                resources:
                  profile: compute-heavy
                reconcile: true

              - name: "{{ .metadata.name }}-memory-heavy"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                resources:
                  profile: memory-heavy
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists

              - path: phase
                value: "Ready"
                when:
                  - field: "{{ allReplicasReady .children.deployments.my-service-medium }}"
                    equals: "true"

