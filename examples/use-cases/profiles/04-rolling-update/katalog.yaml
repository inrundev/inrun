apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: service-rolling-profiles
  description: >
    Profiles 04 — rolling update strategy profiles.
    Creates three Deployments, each using a different rollingUpdate profile.
    The profile expands at Katalog load time into maxSurge and maxUnavailable.
    Trigger a rollout by patching the CR's image and watch the behavior differ.

spec:
  crds:
    service:
      crdFile: ../crd.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onCreate:
            deployments:
              # safe — zero downtime, one pod at a time
              - name: "{{ .metadata.name }}-safe"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                replicas: "3"
                rollingUpdate:
                  profile: safe
                reconcile: true

              # fast — replaces up to 50% immediately
              - name: "{{ .metadata.name }}-fast"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                replicas: "3"
                rollingUpdate:
                  profile: fast
                reconcile: true

              # blue-green — full new set before old is removed
              - name: "{{ .metadata.name }}-bg"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                replicas: "2"
                rollingUpdate:
                  profile: blue-green
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists
              - path: phase
                value: "Ready"
                when:
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "true"

