apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: service-security-profiles
  description: >
    Profiles 02 — security profiles.
    Creates one Deployment per security profile combination.
    securityContext.profile controls the container security context.
    podSecurity.profile controls the pod-level security context.
    Inspect each Deployment to see what each profile expands to.

spec:
  crds:
    service:
      crdFile: ../crd.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}-baseline"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                securityContext:
                  profile: baseline
                podSecurity:
                  profile: baseline
                reconcile: true

              - name: "{{ .metadata.name }}-restricted"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                securityContext:
                  profile: restricted
                podSecurity:
                  profile: restricted
                reconcile: true

              - name: "{{ .metadata.name }}-hardened"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                securityContext:
                  profile: hardened
                podSecurity:
                  profile: hardened
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists
              - path: phase
                value: "Ready"
                when:
                  - field: "{{ allReplicasReady .children.deployments.my-service-restricted }}"
                    equals: "true"

