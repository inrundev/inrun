apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-vault-secret-gate
  description: >
    External pattern 07 — Vault secret readiness gate.
    On every reconcile the operator reads a secret from Vault KV v2 before
    creating the Deployment. If the secret does not exist (404) or its lease
    has expired (403) the Deployment is not created or updated and the phase
    reflects the reason. The reconcile loop is the retry — no custom polling,
    no finalizers.

spec:
  crds:
    webapp:
      crdFile: ../crd.yaml
      admission:
        validation:
          rules:
            - field: spec.image
              operator: exists
              message: "spec.image is required"
              action: deny
            - field: spec.serviceUrl
              operator: exists
              message: "spec.serviceUrl is required — Vault base URL"
              action: deny
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onReconcile:
            # ── Vault secret read — runs every reconcile ───────────────────────
            # The path is constructed from the CR name so each webapp reads its
            # own dedicated secret. continueOnError: true — 403/404 must reach
            # status fields so the phase machine can surface the exact reason.
            external:
              - name: vaultSecret
                url: "{{ .spec.serviceUrl }}/vault/v1/secret/data/apps/{{ .metadata.name }}"
                method: GET
                auth:
                  env: VAULT_TOKEN
                continueOnError: true
                timeout: 5s

            # Only deploy when the secret read returned 200.
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                when:
                  - field: external.vaultSecret.status
                    equals: "200"
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists

              - path: phase
                value: "Ready"
                when:
                  - field: external.vaultSecret.status
                    equals: "200"
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "true"

              # 403 — lease expired, secret must be rotated before the operator proceeds.
              - path: phase
                value: "SecretExpired"
                when:
                  - field: external.vaultSecret.called
                    equals: "true"
                  - field: external.vaultSecret.status
                    equals: "403"

              # 404 — secret has not been provisioned yet.
              - path: phase
                value: "SecretMissing"
                when:
                  - field: external.vaultSecret.called
                    equals: "true"
                  - field: external.vaultSecret.status
                    equals: "404"

              # 5xx — Vault unavailable, transient, retry next reconcile.
              - path: phase
                value: "VaultUnavailable"
                when:
                  - field: external.vaultSecret.called
                    equals: "true"
                  - field: external.vaultSecret.status
                    prefix: "5"

              - path: secretStatus
                value: "{{ .external.vaultSecret.status }}"
                when:
                  - field: external.vaultSecret.called
                    equals: "true"

