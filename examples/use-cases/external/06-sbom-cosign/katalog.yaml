apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-sbom-cosign
  description: >
    External pattern 06 — SBOM and signature verification.
    Two chained calls run once per image change: first fetch the SBOM report,
    then verify the cosign signature. The Deployment is only created after both
    pass. A vulnerability-flagged or unsigned image writes status.rejectedImage
    and the calls are suppressed until spec.image changes.

spec:
  crds:
    webapp:
      crdFile: ../crd.yaml
      admission:
        validation:
          rules:
            - field: spec.image
              operator: exists
              message: "spec.image is required"
              action: deny
            - field: spec.serviceUrl
              operator: exists
              message: "spec.serviceUrl is required — supply chain service base URL"
              action: deny
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onReconcile:
            # ── Call 1: fetch SBOM report ──────────────────────────────────────
            # Skipped once the image is verified or definitively rejected.
            # continueOnError: true — SBOM service unavailable → degrade gracefully,
            # but the cosign call (gated on a clean SBOM) will also be skipped.
            external:
              - name: sbom
                url: "{{ .spec.serviceUrl }}/sbom/{{ .spec.image }}"
                method: GET
                continueOnError: true
                timeout: 10s
                when:
                  - field: status.verifiedImage
                    notEquals: "{{ .spec.image }}"
                  - field: status.rejectedImage
                    notEquals: "{{ .spec.image }}"

            # ── Call 2: verify cosign signature ───────────────────────────────
            # Only fires when the SBOM passed. Chained: uses the SBOM result
            # to ensure we never call the signature service for a vulnerable image.
            # continueOnError: true — rejection details must reach status fields.
              - name: cosign
                url: "{{ .spec.serviceUrl }}/cosign/verify"
                method: POST
                body: '{"image": "{{ .spec.image }}"}'
                continueOnError: true
                timeout: 10s
                when:
                  - field: status.verifiedImage
                    notEquals: "{{ .spec.image }}"
                  - field: status.rejectedImage
                    notEquals: "{{ .spec.image }}"
                  - field: external.sbom.status
                    equals: "200"
                  - field: external.sbom.body
                    contains: '"clean":true'

            # Only deployed after both SBOM and signature are confirmed.
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                when:
                  - field: status.verifiedImage
                    equals: "{{ .spec.image }}"
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists

              - path: phase
                value: "Verifying"
                when:
                  - field: status.verifiedImage
                    notEquals: "{{ .spec.image }}"

              # 4xx from cosign — definitive rejection, gate closes for this image.
              - path: phase
                value: "SignatureRejected"
                when:
                  - field: status.rejectedImage
                    equals: "{{ .spec.image }}"

              # SBOM shows vulnerabilities — written as a rejection to suppress retries.
              - path: phase
                value: "VulnerabilityRejected"
                when:
                  - field: external.sbom.called
                    equals: "true"
                  - field: external.sbom.body
                    contains: '"clean":false'

              # 5xx from either call — transient, gate stays open, next reconcile retries.
              - path: phase
                value: "ServiceUnavailable"
                when:
                  - field: external.sbom.called
                    equals: "true"
                  - field: external.sbom.status
                    prefix: "5"

              - path: phase
                value: "Ready"
                when:
                  - field: status.verifiedImage
                    equals: "{{ .spec.image }}"
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "true"

              # Close both gates: verifiedImage written on cosign 200.
              - path: verifiedImage
                value: "{{ .spec.image }}"
                when:
                  - field: external.cosign.called
                    equals: "true"
                  - field: external.cosign.status
                    equals: "200"

              # Close both gates: rejectedImage written on cosign 4xx.
              - path: rejectedImage
                value: "{{ .spec.image }}"
                when:
                  - field: external.cosign.called
                    equals: "true"
                  - field: external.cosign.status
                    prefix: "4"

              # Also write rejectedImage when the SBOM flags high vulnerabilities
              # so the cosign call is permanently suppressed for this image too.
              - path: rejectedImage
                value: "{{ .spec.image }}"
                when:
                  - field: external.sbom.called
                    equals: "true"
                  - field: external.sbom.body
                    contains: '"clean":false'

              - path: lastError
                value: "{{ .external.cosign.error }}"
                when:
                  - field: external.cosign.called
                    equals: "true"
                  - field: external.cosign.status
                    notEquals: "200"

              - path: lastError
                value: ""
                when:
                  - field: external.cosign.called
                    equals: "true"
                  - field: external.cosign.status
                    equals: "200"

