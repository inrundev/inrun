apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-opa-policy
  description: >
    External pattern 08 — OPA policy enforcement.
    On every reconcile the operator submits the CR context to an OPA endpoint
    and gates the Deployment on the policy decision. A deny surfaces in
    status.phase with the reason from the OPA response. No Go hooks, no
    admission webhooks — the policy check is declarative and observable.

spec:
  crds:
    webapp:
      crdFile: ../crd.yaml
      admission:
        validation:
          rules:
            - field: spec.image
              operator: exists
              message: "spec.image is required"
              action: deny
            - field: spec.serviceUrl
              operator: exists
              message: "spec.serviceUrl is required — OPA service base URL"
              action: deny
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onReconcile:
            # ── OPA policy check — runs every reconcile ────────────────────────
            # Sends CR identity context as OPA input. continueOnError: false —
            # the Deployment must never exist without a passing policy check.
            external:
              - name: policy
                url: "{{ .spec.serviceUrl }}/v1/data/deploy"
                method: POST
                expectedStatus: 200
                continueOnError: false
                timeout: 5s
                body: '
                  {
                    "input": {
                    "name": "{{ .metadata.name }}", 
                    "namespace": "{{ .metadata.namespace }}", 
                    "image": "{{ .spec.image }}"}
                  }'

            # Only deploy when OPA allows.
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                when:
                  - field: external.policy.body
                    contains: '"allow":true'
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists

              - path: phase
                value: "Ready"
                when:
                  - field: external.policy.body
                    contains: '"allow":true'
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "true"

              # Policy denied — surfaces the reason from OPA for observability.
              - path: phase
                value: "PolicyDenied"
                when:
                  - field: external.policy.called
                    equals: "true"
                  - field: external.policy.body
                    contains: '"deny":true'

              - path: policyDecision
                value: "{{ .external.policy.body }}"
                when:
                  - field: external.policy.called
                    equals: "true"

