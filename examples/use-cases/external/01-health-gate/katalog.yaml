apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-health-gate
  description: >
    External pattern 01 — health gate.
    A health check runs before every resource group. When it passes the
    Deployment is created or kept in sync. When it fails the Deployment is not
    touched and the phase flips to Degraded — no reconcile error, no half-deployed
    state. The operator tries again on the next resync.

spec:
  crds:
    webapp:
      crdFile: ../crd.yaml
      admission:
        validation:
          rules:
            - field: spec.image
              operator: exists
              message: "spec.image is required"
              action: deny
            - field: spec.healthCheckUrl
              operator: exists
              message: "spec.healthCheckUrl is required — full URL of the health endpoint to call before reconciling"
              action: deny
      operatorBox:
        reconcile:
          workers: 2
          resync: 15s
          onReconcile:
            # ── External call ──────────────────────────────────────────────────
            # continueOnError: true — a failed health check does not halt the
            # reconcile. Instead the phase state machine below surfaces the
            # failure in status.phase, and the Deployment when: condition prevents
            # a broken app from being created or updated.
            external:
              - name: healthCheck
                url: "{{ .spec.healthCheckUrl }}"
                method: GET
                expectedStatus: 200
                continueOnError: true
                timeout: 5s

            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                when:
                  - field: external.healthCheck.status
                    equals: "200"
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists

              # Health check not yet called — waiting for first reconcile result.
              - path: phase
                value: "Waiting"
                when:
                  - field: external.healthCheck.called
                    equals: "false"

              - path: phase
                value: "Degraded"
                when:
                  - field: external.healthCheck.called
                    equals: "true"
                  - field: external.healthCheck.status
                    notEquals: "200"

              - path: phase
                value: "Ready"
                when:
                  - field: external.healthCheck.status
                    equals: "200"
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "true"

              # Surface the last health check result for visibility.
              - path: lastExternalStatus
                value: "{{ .external.healthCheck.status }}"

              - path: lastExternalError
                value: "{{ .external.healthCheck.error }}"
                clearOnFalse: true
                when:
                  - field: external.healthCheck.error
                    operator: exists

