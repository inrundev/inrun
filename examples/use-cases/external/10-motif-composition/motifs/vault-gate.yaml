apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: vault-gate
  version: 0.1.0
  description: >
    Vault KV v2 secret readiness gate.
    Reads the secret at apps/<cr-name> on every reconcile.
    Surfaces SecretExpired (403) and SecretMissing (404) as distinct phases.
    Any CRD that must not run without a valid Vault secret imports this motif.

inputs:
  - name: serviceUrl
    description: Vault base URL (e.g. http://vault.internal:8200)
    required: true

  - name: vaultToken
    description: Bearer token for Vault. Use $ENV_VAR syntax.
    required: false
    default: "$VAULT_TOKEN"

resources:
  external:
    # Runs every reconcile — secret expiry is a live condition, not a one-time check.
    # continueOnError: true — 403/404 must reach status fields.
    - name: vaultSecret
      url: "{{ .inputs.serviceUrl }}/vault/v1/secret/data/apps/{{ .metadata.name }}"
      method: GET
      headers:
        Authorization: "Bearer {{ .inputs.vaultToken }}"
      continueOnError: true
      timeout: 5s

status:
  fields:
    - path: secretStatus
      value: "{{ .external.vaultSecret.status }}"
      when:
        - field: external.vaultSecret.called
          equals: "true"

    - path: vaultPhase
      value: "SecretReady"
      when:
        - field: external.vaultSecret.status
          equals: "200"

    - path: vaultPhase
      value: "SecretExpired"
      when:
        - field: external.vaultSecret.called
          equals: "true"
        - field: external.vaultSecret.status
          equals: "403"

    - path: vaultPhase
      value: "SecretMissing"
      when:
        - field: external.vaultSecret.called
          equals: "true"
        - field: external.vaultSecret.status
          equals: "404"

    - path: vaultPhase
      value: "VaultUnavailable"
      when:
        - field: external.vaultSecret.called
          equals: "true"
        - field: external.vaultSecret.status
          prefix: "5"
