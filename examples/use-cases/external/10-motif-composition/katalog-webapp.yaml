apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-composed
  description: >
    WebApp operator composed from three motifs: supply-chain, vault-gate, opa-policy.
    The operator does not repeat any of the external call logic — it imports the
    motifs and binds its CR fields through with:. All three checks must pass before
    the Deployment is created.

spec:
  crds:
    webapp:
      crdFile: ./crd-webapp.yaml
      # ── Motif imports ──────────────────────────────────────────────────────
      # Each motif is parameterized via with:. The motif owns the external call
      # sequence, the idempotency gate, and its status fields. The katalog owns
      # the Deployment and the final phase.
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onReconcile:
            # Deployment only created when all three motifs pass.
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                when:
                  - field: status.verifiedImage
                    equals: "{{ .spec.image }}"
                  - field: external.vaultSecret.status
                    equals: "200"
                  - field: external.policy.body
                    contains: '"allow":true'
          default: true
          imports:
            - motif: ./motifs/admission.yaml

            - motif: ./motifs/supply-chain.yaml
              with:
                serviceUrl: "{{ .spec.serviceUrl }}"
                image: "{{ .spec.image }}"

            - motif: ./motifs/vault-gate.yaml
              with:
                serviceUrl: "{{ .spec.serviceUrl }}"

            - motif: ./motifs/opa-policy.yaml
              with:
                serviceUrl: "{{ .spec.serviceUrl }}"
                policy: "deploy"
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists

              - path: phase
                value: "Ready"
                when:
                  - field: status.verifiedImage
                    equals: "{{ .spec.image }}"
                  - field: external.vaultSecret.status
                    equals: "200"
                  - field: external.policy.body
                    contains: '"allow":true'
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "true"

              - path: phase
                value: "Blocked"
                when:
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "false"

