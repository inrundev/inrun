apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: worker-composed
  description: >
    Worker operator composed from two motifs: vault-gate and opa-policy.
    Workers do not go through supply chain verification — they run internal
    images that are already trusted. But they still need a valid Vault secret
    and must pass the org policy check before deploying.
    The same vault-gate and opa-policy motifs used by WebApp are imported here
    — no duplication of that logic.

spec:
  crds:
    worker:
      crdFile: ./crd-worker.yaml
      # ── Motif imports ──────────────────────────────────────────────────────
      # vault-gate and opa-policy are the same motif files imported by WebApp.
      # with: binds the Worker CR's fields — the motif does not know or care
      # whether it is being consumed by a WebApp or a Worker.
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onReconcile:
            # Deployment only when Vault secret is valid and OPA allows.
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                when:
                  - field: external.vaultSecret.status
                    equals: "200"
                  - field: external.policy.body
                    contains: '"allow":true'
          default: true
          imports:
            - motif: ./motifs/admission.yaml

            - motif: ./motifs/vault-gate.yaml
              with:
                serviceUrl: "{{ .spec.serviceUrl }}"

            - motif: ./motifs/opa-policy.yaml
              with:
                serviceUrl: "{{ .spec.serviceUrl }}"
                policy: "deploy"
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists

              - path: phase
                value: "Ready"
                when:
                  - field: external.vaultSecret.status
                    equals: "200"
                  - field: external.policy.body
                    contains: '"allow":true'
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "true"

              - path: phase
                value: "Blocked"
                when:
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "false"

