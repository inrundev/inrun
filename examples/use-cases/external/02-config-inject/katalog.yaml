apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-config-inject
  description: >
    External pattern 02 — dynamic config injection.
    On every reconcile, the operator fetches a JSON config from an external
    service and embeds the response body into a ConfigMap. The Deployment
    mounts the ConfigMap so the app always sees the latest config without
    a restart or a redeploy. The config call is optional (continueOnError: true)
    — if the service is unavailable the ConfigMap is simply not updated.

spec:
  crds:
    webapp:
      crdFile: ../crd.yaml
      admission:
        validation:
          rules:
            - field: spec.image
              operator: exists
              message: "spec.image is required"
              action: deny
            - field: spec.serviceUrl
              operator: exists
              message: "spec.serviceUrl is required — the config server base URL"
              action: deny
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onReconcile:
            # ── External call ──────────────────────────────────────────────────
            # continueOnError: true — the config service being down should not
            # block the Deployment. The ConfigMap is only updated when the call
            # succeeds; on failure it retains whatever was last written.
            external:
              - name: appConfig
                url: "{{ .spec.serviceUrl }}/config/{{ .metadata.name }}"
                method: GET
                continueOnError: true
                timeout: 5s

            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                volumes:
                  - name: app-config
                    configMap:
                      name: "{{ .metadata.name }}-config"
                volumeMounts:
                  - name: app-config
                    mountPath: /etc/config

            # Only written when the config call succeeded.
            configMaps:
              - name: "{{ .metadata.name }}-config"
                data:
                  app.json: "{{ .external.appConfig.body }}"
                when:
                  - field: external.appConfig.called
                    equals: "true"
                  - field: external.appConfig.error
                    operator: notExists
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists

              - path: phase
                value: "Ready"
                when:
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "true"

              - path: phase
                value: "Deploying"
                when:
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "false"

              - path: lastExternalStatus
                value: "{{ .external.appConfig.status }}"

              # configFresh: true when the last config call succeeded this cycle.
              - path: configFresh
                value: "true"
                when:
                  - field: external.appConfig.called
                    equals: "true"
                  - field: external.appConfig.error
                    operator: notExists

              - path: configFresh
                value: "false"
                when:
                  - field: external.appConfig.error
                    operator: exists

