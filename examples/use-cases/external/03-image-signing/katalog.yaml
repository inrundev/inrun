apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-image-signing
  description: >
    External pattern 03 — image signing with the "once per image" pattern.
    The signing call only fires when spec.image differs from status.signedImage.
    After a successful sign, status.signedImage is set to the current image —
    subsequent reconciles skip the call entirely until the image changes again.
    No new machinery needed: a status field and a when: condition do all the work.

spec:
  crds:
    webapp:
      crdFile: ../crd.yaml
      admission:
        validation:
          rules:
            - field: spec.image
              operator: exists
              message: "spec.image is required"
              action: deny
            - field: spec.serviceUrl
              operator: exists
              message: "spec.serviceUrl is required — your image signing service base URL"
              action: deny
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onReconcile:
            # ── External call — only fires when the image changes ──────────────
            # The when: condition gates the call: if spec.image already matches
            # status.signedImage the signing service is not called this cycle.
            # This is the idiomatic "once per image" pattern — no annotations,
            # no counters, just a status field and a condition.
            external:
              - name: signImage
                url: "{{ .spec.serviceUrl }}/sign"
                method: POST
                body: '{"image": "{{ .spec.image }}", "namespace": "{{ .metadata.namespace }}"}'
                auth:
                  env: IMAGE_SIGNING_TOKEN
                expectedStatus: 200
                continueOnError: true
                timeout: 15s
                when:
                  - field: status.signedImage
                    notEquals: "{{ .spec.image }}"
                  - field: status.rejectedImage
                    notEquals: "{{ .spec.image }}"

            # Only created or updated after the image is signed.
            # This is the key gate: the Deployment tracks spec.image only when
            # the signing service has confirmed it is safe.
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                when:
                  - field: status.signedImage
                    equals: "{{ .spec.image }}"
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists

              - path: phase
                value: "Signing"
                when:
                  - field: status.signedImage
                    notEquals: "{{ .spec.image }}"

              # 4xx → definitive rejection. Reads from status.rejectedImage (persistent)
              # so the phase survives subsequent reconciles where the call is skipped.
              - path: phase
                value: "SigningRejected"
                when:
                  - field: status.rejectedImage
                    equals: "{{ .spec.image }}"

              # 5xx → transient. Reads from external.* because it only applies during
              # the reconcile where the call was made — next reconcile retries.
              - path: phase
                value: "SigningUnavailable"
                when:
                  - field: external.signImage.called
                    equals: "true"
                  - field: external.signImage.status
                    prefix: "5"

              - path: phase
                value: "Ready"
                when:
                  - field: status.signedImage
                    equals: "{{ .spec.image }}"
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "true"

              # Written after a successful sign. This is what prevents re-signing
              # on every reconcile — the next cycle sees signedImage == spec.image
              # and skips both the external call and this status write.
              - path: signedImage
                value: "{{ .spec.image }}"
                when:
                  - field: external.signImage.called
                    equals: "true"
                  - field: external.signImage.status
                    equals: "200"

              - path: lastSigningStatus
                value: "{{ .external.signImage.status }}"
                when:
                  - field: external.signImage.called
                    equals: "true"

              # 4xx → definitive policy rejection → lock out retries for this image.
              # The reconcile (which is the retry) will skip the call until spec.image changes.
              # 5xx → transient service failure → do NOT write rejectedImage → reconcile retries naturally.
              - path: rejectedImage
                value: "{{ .spec.image }}"
                when:
                  - field: external.signImage.called
                    equals: "true"
                  - field: external.signImage.status
                    prefix: "4"

              # Write error when call fires and fails — persists across reconciles where
              # the call is skipped (no clearOnFalse — we never want to erase the error
              # just because the gate prevented the call this cycle).
              - path: lastSigningError
                value: "{{ .external.signImage.error }}"
                when:
                  - field: external.signImage.called
                    equals: "true"
                  - field: external.signImage.status
                    notEquals: "200"

              # Explicitly clear the error when signing succeeds.
              - path: lastSigningError
                value: ""
                when:
                  - field: external.signImage.called
                    equals: "true"
                  - field: external.signImage.status
                    equals: "200"

