apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-cert-readiness
  description: >
    External pattern 09 — certificate readiness gate.
    On every reconcile the operator checks whether a TLS certificate has been
    issued for this CR. The Deployment is only created when the cert status is
    "issued". A pending cert (202) or missing cert (404) blocks the Deployment
    and the phase reflects the current state. When the cert is eventually issued
    the next reconcile creates the Deployment — no manual intervention needed.

spec:
  crds:
    webapp:
      crdFile: ../crd.yaml
      admission:
        validation:
          rules:
            - field: spec.image
              operator: exists
              message: "spec.image is required"
              action: deny
            - field: spec.serviceUrl
              operator: exists
              message: "spec.serviceUrl is required — cert service base URL"
              action: deny
      operatorBox:
        reconcile:
          workers: 2
          resync: 15s
          onReconcile:
            # ── Certificate status check — runs every reconcile ────────────────
            # continueOnError: true — pending cert is normal during issuance;
            # the phase state machine surfaces Pending vs Ready without halting.
            external:
              - name: cert
                url: "{{ .spec.serviceUrl }}/certs/{{ .metadata.name }}/status"
                method: GET
                continueOnError: true
                timeout: 5s

            # Only deploy when the cert is issued (status 200, body contains "issued").
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                when:
                  - field: external.cert.status
                    equals: "200"
                  - field: external.cert.body
                    contains: '"status":"issued"'
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists

              - path: phase
                value: "Ready"
                when:
                  - field: external.cert.status
                    equals: "200"
                  - field: external.cert.body
                    contains: '"status":"issued"'
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "true"

              # 202 — cert is still being issued, wait and retry.
              - path: phase
                value: "CertPending"
                when:
                  - field: external.cert.called
                    equals: "true"
                  - field: external.cert.status
                    equals: "202"

              # 5xx — cert service unavailable, transient, retry next reconcile.
              - path: phase
                value: "CertServiceUnavailable"
                when:
                  - field: external.cert.called
                    equals: "true"
                  - field: external.cert.status
                    prefix: "5"

              - path: certStatus
                value: "{{ .external.cert.body }}"
                when:
                  - field: external.cert.called
                    equals: "true"

