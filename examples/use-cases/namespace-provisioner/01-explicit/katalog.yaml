apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: namespace-provisioner-explicit
  version: v1.0.0
  description: >
    Namespace Provisioner 01 — explicit resource limits.
    One NamespaceClaim CR provisions a Namespace, two NetworkPolicies (via the
    tenant-isolation motif), a ResourceQuota with explicit hard limits from the
    CR spec, and a ClusterRole + ClusterRoleBinding (via the tenant-rbac motif)
    that give the owner ServiceAccount admin access.
  author: orkspace
  tags:
    - namespace
    - networkpolicy
    - resourcequota
    - clusterrole
    - multi-tenancy

spec:
  crds:
    namespaceclaim:
      crdFile: ../crd.yaml
      crFiles: 
        - cr.yaml
      setup:
        apply:
          - ../setup.yaml
        wait:
          - kind: Secret
            name: database-credentials
            namespace: platform
            timeout: 15s
      operatorBox:
        reconcile:
          workers: 2
          resync: 1m
          onCreate:
            namespaces:
              - name: "{{ .spec.targetNamespace }}"
                labels:
                  team: "{{ .spec.team }}"
                  managed-by: orkestra
                reconcile: true

            serviceAccounts:
              - name: "{{ .spec.owner }}"
                namespace: "{{ .spec.targetNamespace }}"
                labels:
                  team: "{{ .spec.team }}"
                  managed-by: orkestra
                reconcile: true

            secrets:
              - name: registry-credentials
                fromSecret: registry-credentials
                fromNamespace: platform
                toNamespaces:
                  - "{{ .spec.targetNamespace }}"
                reconcile: true

            resourceQuotas:
              - name: "{{ .spec.team }}-quota"
                namespace: "{{ .spec.targetNamespace }}"
                hard:
                  pods: "{{ .spec.limits.maxPods }}"
                  requests.cpu: "{{ .spec.limits.cpu }}"
                  requests.memory: "{{ .spec.limits.memory }}"
                  limits.cpu: "{{ .spec.limits.cpu }}"
                  limits.memory: "{{ .spec.limits.memory }}"
                labels:
                  team: "{{ .spec.team }}"
                  managed-by: orkestra
                reconcile: true
          imports:
            - motif: ../motifs/tenant-isolation/motif.yaml
              with:
                namespace: "{{ .spec.targetNamespace }}"
                team: "{{ .spec.team }}"

            - motif: ../motifs/tenant-rbac/motif.yaml
              with:
                team: "{{ .spec.team }}"
                targetNamespace: "{{ .spec.targetNamespace }}"
                owner: "{{ .spec.owner }}"
                ownerNamespace: "{{ .spec.ownerNamespace }}"
        emit:
          status:
            fields:
              - path: phase
                value: Provisioning
                when:
                  - field: status.phase
                    operator: notExists

              - path: phase
                value: Ready
                when:
                  - field: "{{ resourceExists .children.namespaces }}"
                    equals: "true"

              - path: namespace
                value: "{{ .spec.targetNamespace }}"

              - path: team
                value: "{{ .spec.team }}"

