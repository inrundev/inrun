apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: namespace-provisioner-user-profiles
  version: v1.0.0
  description: >
    Namespace Provisioner 03 — all six user-defined profile classes in one place.
    Demonstrates that every profile class (networkPolicies, resourceQuotas,
    limitRanges, hpa, pdb, rollingUpdate) can be declared and resolved from the
    katalog's own profiles: block instead of using Orkestra built-ins.

    The RBAC layer comes from the shared tenant-rbac motif.
    Network isolation is defined here as user profiles, not built-ins.
  author: orkspace
  tags:
    - namespace
    - networkpolicy
    - resourcequota
    - limitrange
    - hpa
    - pdb
    - rollingupdate
    - user-defined-profiles
    - multi-tenancy

# ── User-defined profiles ─────────────────────────────────────────────────────
# All six classes declared here. None of these names collide with Orkestra
# built-ins — they use an org- prefix to make that explicit.
profiles:

  # NetworkPolicy: org-scoped isolation rules
  networkPolicies:
    - name: org-deny-all
      description: Block all ingress and egress (policyTypes makes it explicit)
      policyTypes: [Ingress, Egress]

    - name: org-allow-dns-egress
      description: Allow UDP/TCP port 53 so pods can resolve DNS
      egress:
        - ports:
            - port: 53
              protocol: UDP
            - port: 53
              protocol: TCP
      policyTypes: [Egress]

    - name: org-allow-monitoring
      description: Allow ingress from the platform monitoring namespace
      ingress:
        - from:
            - namespaceSelector:
                team: platform
      policyTypes: [Ingress]

  # ResourceQuota: org-defined capacity tiers (different names from built-ins)
  resourceQuotas:
    - name: org-small
      description: Minimal allocation for prototype or CI namespaces
      hard:
        pods: "10"
        cpu: "1"
        memory: "2Gi"
        requests.cpu: "500m"
        requests.memory: "1Gi"
        limits.cpu: "1"
        limits.memory: "2Gi"

    - name: org-medium
      description: Standard team namespace allocation
      hard:
        pods: "25"
        cpu: "4"
        memory: "8Gi"
        requests.cpu: "2"
        requests.memory: "4Gi"
        limits.cpu: "4"
        limits.memory: "8Gi"

    - name: org-large
      description: High-traffic or data-intensive team namespaces
      hard:
        pods: "60"
        cpu: "12"
        memory: "24Gi"
        requests.cpu: "6"
        requests.memory: "12Gi"
        limits.cpu: "12"
        limits.memory: "24Gi"

  # LimitRange: container defaults so unset workloads still have sensible bounds
  limitRanges:
    - name: org-container-defaults
      description: Default CPU/memory requests and limits for containers that do not declare them
      limits:
        - type: Container
          default:
            cpu: 500m
            memory: 512Mi
          defaultRequest:
            cpu: 100m
            memory: 128Mi
          max:
            cpu: "4"
            memory: 8Gi

  # HPA: org autoscaling presets — each profile sets a CPU target and scale-down window
  hpa:
    - name: org-conservative
      description: Conservative scale-down for stateful or slow-starting services
      targetCPUUtilizationPercentage: "70"
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60

    - name: org-burst
      description: Faster scale-down for stateless services that recover quickly
      targetCPUUtilizationPercentage: "60"
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
          policies:
            - type: Percent
              value: 20
              periodSeconds: 30

  # PDB: availability guarantees during voluntary disruptions
  pdb:
    - name: org-at-least-one
      description: Always keep at least one pod available during drains or rollouts
      minAvailable: "1"

    - name: org-majority
      description: Keep the majority of pods available (suitable for quorum workloads)
      minAvailable: "51%"

  # RollingUpdate: rollout strategies
  rollingUpdate:
    - name: org-safe
      description: Zero-downtime rollout — adds new pod before removing the old one
      maxSurge: "1"
      maxUnavailable: "0"

    - name: org-fast
      description: Fast rollout — tolerates some disruption to replace pods quickly
      maxSurge: "25%"
      maxUnavailable: "25%"

# ── CRD definition ─────────────────────────────────────────────────────────────
spec:
  crds:
    namespaceclaim:
      crdFile: ../crd.yaml
      crFiles:
        - cr.yaml
      setup:
        apply:
          - ../setup.yaml
        wait:
          - kind: Secret
            name: database-credentials
            namespace: platform
            timeout: 15s
      operatorBox:
        reconcile:
          workers: 2
          resync: 1m
          onCreate:
            namespaces:
              - name: "{{ .spec.targetNamespace }}"
                labels:
                  team: "{{ .spec.team }}"
                  managed-by: orkestra
                reconcile: true

            serviceAccounts:
              - name: "{{ .spec.owner }}"
                namespace: "{{ .spec.targetNamespace }}"
                labels:
                  team: "{{ .spec.team }}"
                  managed-by: orkestra
                reconcile: true

            # ── networkPolicies: user-defined org-* profiles ────────────────
            networkPolicies:
              - name: "{{ .spec.team }}-deny-all"
                namespace: "{{ .spec.targetNamespace }}"
                podSelector: {}
                profile: org-deny-all
                labels:
                  team: "{{ .spec.team }}"
                  managed-by: orkestra
                reconcile: true

              - name: "{{ .spec.team }}-allow-dns"
                namespace: "{{ .spec.targetNamespace }}"
                podSelector: {}
                profile: org-allow-dns-egress
                labels:
                  team: "{{ .spec.team }}"
                  managed-by: orkestra
                reconcile: true

              - name: "{{ .spec.team }}-allow-monitoring"
                namespace: "{{ .spec.targetNamespace }}"
                podSelector: {}
                profile: org-allow-monitoring
                labels:
                  team: "{{ .spec.team }}"
                  managed-by: orkestra
                reconcile: true

            # ── resourceQuotas: user-defined org-* tier ────────────────────
            # The template resolves spec.tier ("small"|"medium"|"large") to the
            # org- prefixed profile name at reconcile time.
            resourceQuotas:
              - name: "{{ .spec.team }}-quota"
                namespace: "{{ .spec.targetNamespace }}"
                profile: "{{ printf \"org-%s\" .spec.tier }}"
                labels:
                  team: "{{ .spec.team }}"
                  managed-by: orkestra
                reconcile: true

            # ── limitRanges: user-defined container defaults ─────────────────
            limitRanges:
              - name: "{{ .spec.team }}-container-limits"
                namespace: "{{ .spec.targetNamespace }}"
                profile: org-container-defaults
                labels:
                  team: "{{ .spec.team }}"
                  managed-by: orkestra
                reconcile: true

            # ── Namespace agent deployment ────────────────────────────────────
            # A lightweight agent that runs in each provisioned namespace.
            # Uses org-safe rolling update and org-conservative HPA/PDB profiles.
            deployments:
              - name: "{{ .spec.team }}-ns-agent"
                namespace: "{{ .spec.targetNamespace }}"
                image: orkspace/ns-agent:v1
                replicas: "2"
                rollingUpdate:
                  profile: org-safe
                labels:
                  team: "{{ .spec.team }}"
                  app: ns-agent
                  managed-by: orkestra
                reconcile: true

            # ── hpa: user-defined org-conservative preset ────────────────────
            hpa:
              - name: "{{ .spec.team }}-ns-agent-hpa"
                namespace: "{{ .spec.targetNamespace }}"
                scaleTargetRef:
                  apiVersion: apps/v1
                  kind: Deployment
                  name: "{{ .spec.team }}-ns-agent"
                minReplicas: "2"
                maxReplicas: "8"
                behavior:
                  profile: org-conservative
                labels:
                  team: "{{ .spec.team }}"
                  managed-by: orkestra
                reconcile: true

            # ── pdb: user-defined org-at-least-one preset ────────────────────
            pdb:
              - name: "{{ .spec.team }}-ns-agent-pdb"
                namespace: "{{ .spec.targetNamespace }}"
                selector:
                  app: ns-agent
                  team: "{{ .spec.team }}"
                behavior:
                  profile: org-at-least-one
                labels:
                  team: "{{ .spec.team }}"
                  managed-by: orkestra
                reconcile: true

            secrets:
              - name: registry-credentials
                fromSecret: registry-credentials
                fromNamespace: platform
                toNamespaces:
                  - "{{ .spec.targetNamespace }}"
                reconcile: true
          imports:
            - motif: ../motifs/tenant-rbac/motif.yaml
              with:
                team: "{{ .spec.team }}"
                targetNamespace: "{{ .spec.targetNamespace }}"
                owner: "{{ .spec.owner }}"
                ownerNamespace: "{{ .spec.ownerNamespace }}"
        emit:
          status:
            fields:
              - path: phase
                value: Provisioning
                when:
                  - field: status.phase
                    operator: notExists

              - path: phase
                value: Ready
                when:
                  - field: "{{ resourceExists .children.namespaces }}"
                    equals: "true"

              - path: namespace
                value: "{{ .spec.targetNamespace }}"

              - path: team
                value: "{{ .spec.team }}"

