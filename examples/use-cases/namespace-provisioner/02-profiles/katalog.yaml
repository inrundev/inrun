apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: namespace-provisioner-profiles
  version: v1.0.0
  description: >
    Namespace Provisioner 02 — profile-based resource limits.
    Identical outcome to 01-explicit but the ResourceQuota is declared with
    profile: "{{ .spec.tier }}" instead of explicit hard limits. The CR only
    needs a tier name (small/medium/large/xlarge) — Orkestra expands it at
    reconcile time. The NetworkPolicy and RBAC layers come from the same
    shared motifs as example 01.
  author: orkspace
  tags:
    - namespace
    - networkpolicy
    - resourcequota
    - profiles
    - multi-tenancy

spec:
  crds:
    namespaceclaim:
      crdFile: ../crd.yaml
      crFiles: 
        - cr.yaml
      setup:
        apply:
          - ../setup.yaml
        wait:
          - kind: Secret
            name: database-credentials
            namespace: platform
            timeout: 15s
      operatorBox:
        reconcile:
          workers: 2
          resync: 1m
          onCreate:
            namespaces:
              - name: "{{ .spec.targetNamespace }}"
                labels:
                  team: "{{ .spec.team }}"
                  tier: "{{ .spec.tier }}"
                  managed-by: orkestra
                reconcile: true

            serviceAccounts:
              - name: "{{ .spec.owner }}"
                namespace: "{{ .spec.targetNamespace }}"
                labels:
                  team: "{{ .spec.team }}"
                  managed-by: orkestra
                reconcile: true

            secrets:
              - name: registry-credentials
                fromSecret: registry-credentials
                fromNamespace: platform
                toNamespaces:
                  - "{{ .spec.targetNamespace }}"
                reconcile: true

            resourceQuotas:
              - name: "{{ .spec.team }}-quota"
                namespace: "{{ .spec.targetNamespace }}"
                profile: "{{ .spec.tier }}"
                labels:
                  team: "{{ .spec.team }}"
                  tier: "{{ .spec.tier }}"
                  managed-by: orkestra
                reconcile: true
          imports:
            - motif: ../motifs/tenant-isolation/motif.yaml
              with:
                namespace: "{{ .spec.targetNamespace }}"
                team: "{{ .spec.team }}"

            - motif: ../motifs/tenant-rbac/motif.yaml
              with:
                team: "{{ .spec.team }}"
                targetNamespace: "{{ .spec.targetNamespace }}"
                owner: "{{ .spec.owner }}"
                ownerNamespace: "{{ .spec.ownerNamespace }}"
        emit:
          status:
            fields:
              - path: phase
                value: Provisioning
                when:
                  - field: status.phase
                    operator: notExists

              - path: phase
                value: Ready
                when:
                  - field: "{{ resourceExists .children.namespaces }}"
                    equals: "true"

              - path: namespace
                value: "{{ .spec.targetNamespace }}"

              - path: team
                value: "{{ .spec.team }}"

              - path: tier
                value: "{{ .spec.tier }}"

