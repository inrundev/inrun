apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: workload-operator
  description: >
    Normalize pattern 03 — defaults without a webhook.
    The default note inside normalize applies field defaults at reconcile time.
    No Orkestra Gateway required. cr-minimal and cr-full produce identical
    Deployments — proof that normalize filled in everything the user left out.

spec:
  crds:
    workload:
      crdFile: ./crd.yaml
      # ── Normalize ──────────────────────────────────────────────────────────
      # Using default in normalize = mutation without an admission webhook.
      # Every field has a safe value after this block runs — no nil checks
      # needed anywhere downstream.
      admission:
        validation:
          rules:
            - field: spec.image
              operator: exists
              message: "spec.image is required"
              action: deny
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onCreate:
            deployments:
              # All fields are guaranteed to have values — no defensive defaults here.
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                reconcile: true
                env:
                  - name: CONCURRENCY_POLICY
                    value: "{{ .spec.concurrencyPolicy }}"
          normalize:
            spec:
              replicas:          "{{ .spec.replicas | default 1  }}"
              concurrencyPolicy: '{{ .spec.concurrencyPolicy | default "Allow" }}'
              suspend:           "{{ .spec.suspend | default false }}"
              resources.requests.cpu:    '{{ resourceCPU . | default "100m" }}'
              resources.requests.memory: '{{ resourceMemory . | default "128Mi" }}'
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists

              - path: phase
                value: "Ready"
                when:
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "true"

              # Show the defaults normalize applied — inspect these after applying cr-minimal.
              - path: replicas
                value: "{{ .spec.replicas }}"
              - path: cpu
                value: "{{ .spec.resources.requests.cpu }}"
              - path: memory
                value: "{{ .spec.resources.requests.memory }}"
              - path: concurrencyPolicy
                value: "{{ .spec.concurrencyPolicy }}"

