apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: tenant-operator
  description: >
    Normalize pattern 01 — string cleanup.
    Accepts environment names in any casing, domains with or without
    protocol prefix, and tenant names in any format.
    After normalize, all downstream logic sees clean, canonical values.

spec:
  crds:
    tenant:
      crdFile: ./crd.yaml
      # ── Normalize ──────────────────────────────────────────────────────────
      # Each field normalizes independently against the raw CR.
      # After this block, all template expressions see canonical values.
      admission:
        validation:
          rules:
            - field: spec.name
              operator: exists
              message: "spec.name is required"
              action: deny
            - field: spec.domain
              operator: exists
              message: "spec.domain is required"
              action: deny
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onCreate:
            configMaps:
              - name: "{{ .metadata.name }}-config"
                data:
                  # All values are already canonical — no branching, no defensive toLower here.
                  TENANT_NAME: "{{ .spec.name }}"
                  TENANT_ENV:  "{{ .spec.environment }}"
                  TENANT_TIER: "{{ .spec.tier }}"
                  APP_DOMAIN:  "{{ .spec.domain }}"
          normalize:
            # audit: true records which fields were transformed and their before/after values.
            # Available in status as ._normalizeChanges — see status.normalizeChanges below.
            audit: true
            spec:
              # Environment — lowercase, no surrounding whitespace.
              # " Production ", "STAGING", "Development" → "production", "staging", "development"
              environment: '{{ default "production" .spec.environment | toLower | trimSpace }}'

              # Domain — strip protocol prefix and trailing slash.
              # "https://my-app.example.com/" → "my-app.example.com"
              # "http://my-app.example.com"   → "my-app.example.com"
              # "my-app.example.com"          → "my-app.example.com" (unchanged)
              domain: '{{ domainHost .spec.domain }}'

              # Tenant name — lowercase and trimmed.
              # "Acme Corp ", "ACME-CORP" → "acme corp", "acme-corp"
              name: '{{ .spec.name | toLower | trimSpace }}'

              # Tier — lowercase.
              # "Premium", "STANDARD" → "premium", "standard"
              tier: '{{ default "standard" .spec.tier | toLower }}'
        emit:
          status:
            fields:
              - path: phase
                value: "Active"

              # These reflect the normalized values — inspect them to confirm normalization ran.
              - path: name
                value: "{{ .spec.name }}"
              - path: environment
                value: "{{ .spec.environment }}"
              - path: domain
                value: "{{ .spec.domain }}"
              - path: tier
                value: "{{ .spec.tier }}"

              # normalizeChanges — what was transformed this reconcile cycle.
              # Only present when at least one field differed from its raw value.
              # Empty for cr-clean.yaml (already canonical — nothing to transform).
              - path: normalizeChanges
                value: "{{ toJson ._normalizeChanges }}"
                when:
                  - field: "{{ notEmpty ._normalizeChanges }}"
                    equals: "true"

