apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: flex-app
  description: >
    Pattern 05 — or:.
    Creates Jobs when any one of several phase conditions is true (OR logic).
    when: and or: can be combined: when: is AND, or: is OR, both must pass.
    Replaces multi-branch if-conditions in OnReconcile hooks.

spec:
  crds:
    flex-app:
      crdFile: ./crd.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
          onReconcile:
            jobs:
              - name: "{{ .metadata.name }}-cleanup"
                image: alpine:3.19
                command: ["/bin/sh", "-c", "echo 'cleanup complete'"]
                or:
                  - field: status.phase
                    equals: "Failed"
                  - field: status.phase
                    equals: "Succeeded"

              - name: "{{ .metadata.name }}-notify"
                image: alpine:3.19
                command: ["/bin/sh", "-c", "echo 'notification sent'"]
                when:
                  - field: spec.notify
                    equals: "true"
                or:
                  - field: status.phase
                    equals: "Running"
                  - field: status.phase
                    equals: "Failed"
                  - field: status.phase
                    equals: "Succeeded"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
                when:
                  - field: status.phase
                    operator: notExists
              - path: phase
                value: "Succeeded"
                when:
                  - field: "{{ jobSucceeded .children.job }}"
                    equals: "true"

