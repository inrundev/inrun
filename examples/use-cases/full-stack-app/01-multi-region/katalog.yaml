apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: multi-region-app
  description: >
    Pattern 01 — forEach.
    Iterates over spec.regions and creates one Deployment per region.
    Replaces a Go reconciler that ranged over a slice and called client.Create().

spec:
  crds:
    multi-region-app:
      crdFile: ./crd.yaml
      admission:
        validation:
          rules:
            - field: spec.image
              operator: exists
              message: "spec.image is required"
              action: deny
            - field: spec.regions
              operator: exists
              message: "spec.regions is required"
              action: deny
        mutation:
          rules:
            - field: spec.defaultReplicas
              default: 1
              valueType: int
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onReconcile:
            deployments:
              - name: "{{ .metadata.name }}-{{ .item }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.defaultReplicas }}"
                forEach:
                  field: spec.regions
                  as: item
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists

              - path: phase
                value: "Ready"
                when:
                  - field: "{{ readyReplicas .children.deployment }}"
                    operator: gt
                    value: "0"

              - path: regionsDeployed
                value: "{{ len .spec.regions }}"

