apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: cronjob-operator
  description: >
    Multi-version CronJob operator. v1 uses a cron string. v2 uses a
    structured schedule object. Conversion is lossless and bidirectional,
    declared entirely in YAML using cron notes. No Go. No hooks.
    No separate conversion webhook. One process. One Katalog.
security:
  conversion:
    enabled: true

gateway:
  endpoint: http://orkestra-gateway:8080

spec:
  crds:
    # ── v2 ─────────────────────────────────────────────────────────────────
    # The current, storage version. All objects live here.
    # The API server calls /convert when a request comes in as v1.
    # Orkestra handles the conversion in-process — zero extra infrastructure.
    cronjob-v2:
      apiTypes:
        group: demo.orkestra.io
        version: v2
        kind: CronJob
        plural: cronjobs
      # ── Lossless version conversion using cron notes ───────────────────────
      #
      # The core change between v1 and v2:
      #   v1: schedule: "*/5 0 * * 1"    (one string, five fields joined)
      #   v2: schedule:                   (named structured fields)
      #         minute: "*/5"
      #         hour: "0"
      #         dayOfMonth: "*"
      #         month: "*"
      #         dayOfWeek: "1"
      #
      # Shorthands:
      #   cronToMap "*/5 0 * * 1"  →  {minute:"*/5", hour:"0", dom:"*", month:"*", dow:"1"}
      #   cronFromMap {minute:"*/5", …}  →  "*/5 0 * * 1"
      #
      # Both notes accept either shape (string or map) so the conversion is
      # robust even when objects were stored before the schema was updated.
      # Round-trip guarantee: v1 → v2 → v1 produces the canonical cron string.
      # @-macros are expanded transparently: @hourly → "0 * * * *"
      #
      # ── OperatorBox Reconciliation ─────────────────────────────────────────────────────────
      admission:
        conversion:
          storageVersion: v1
          updateCRD: true
          paths:
            # v1 → v2: cronToMap splits the cron string into the structured map
            - from: v1
              to: v2
              spec:
                schedule:                   "{{ cronToMap .spec.schedule }}"
                image:                      "{{ .spec.image }}"
                concurrencyPolicy:          '{{ default "Allow" .spec.concurrencyPolicy }}'
                startingDeadlineSeconds:    "{{ .spec.startingDeadlineSeconds }}"
                successfulJobsHistoryLimit: "{{ default 3 .spec.successfulJobsHistoryLimit }}"
                failedJobsHistoryLimit:     "{{ default 1 .spec.failedJobsHistoryLimit }}"
                suspend:                    "{{ default false .spec.suspend }}"

            # v2 → v1: cronFromMap converts structured maps to legacy flat strings.
            - from: v2
              to: v1
              spec:
                schedule:                   "{{ cronFromMap .spec.schedule }}"
                image:                      "{{ .spec.image }}"
                concurrencyPolicy:          '{{ default "Allow" .spec.concurrencyPolicy }}'
                startingDeadlineSeconds:    "{{ .spec.startingDeadlineSeconds }}"
                successfulJobsHistoryLimit: "{{ default 3 .spec.successfulJobsHistoryLimit }}"
                failedJobsHistoryLimit:     "{{ default 1 .spec.failedJobsHistoryLimit }}"
                suspend:                    "{{ default false .spec.suspend }}"
      operatorBox:
        reconcile:
          workers: 5
          resync: 30s
          onCreate:
            cronJobs:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                schedule: "{{ cronFromAny .spec.schedule }}"
                suspend: "{{ .spec.suspend }}"
                successfulJobsHistoryLimit: "{{ .spec.successfulJobsHistoryLimit }}"
                failedJobsHistoryLimit: "{{ .spec.failedJobsHistoryLimit }}"
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: '{{ ternary .spec.suspend "Suspended" "Active" }}'

              # cronFromAny handles both structured maps and legacy flat strings.
              - path: scheduleExpression
                value: "{{ cronFromAny .spec.schedule }}"

              - path: scheduleDescription
                value: "{{ cronDescribe .spec.schedule }}"

              - path: image
                value: "{{ .spec.image }}"

              - path: concurrencyPolicy
                value: "{{ .spec.concurrencyPolicy }}"

              # Last schedule time from the child CronJob
              - path: lastScheduleTime
                value: '{{ cronJobLastScheduleTime .children.cronjob }}'

              - path: nextScheduleTime
                value: '{{ cronJobNextScheduleTime .children.cronjob }}'
        # Status — three layers
        # Layer 1: Ready condition — automatic after every reconcile
        # Layer 2: Declared fields — resolved from live CR
        # Layer 3: children.* — populated from child CronJob

    # ── v1 ─────────────────────────────────────────────────────────────────
    # The legacy API. Objects applied as v1 are converted to v2 before
    # storage. Objects read as v1 are converted from v2 on the way out.
    # This CRD entry is present so Orkestra watches v1 events correctly.
    cronjob-v1:
      apiTypes:
        group: demo.orkestra.io
        version: v1
        kind: CronJob
        plural: cronjobs
      # participant: true marks this CRD as part of the conversion pair.
      # The paths live on cronjob-v2. This flag lets the Control Center
      # show conversion stats for v1 without duplicating path declarations.
      admission:
        conversion:
          participant: true
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onCreate:
            cronJobs:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                schedule: "{{ .spec.schedule }}"
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: '{{ ternary .spec.suspend "Suspended" "Active" }}'
              - path: scheduleExpression
                value: "{{ .spec.schedule }}"
              - path: image
                value: "{{ .spec.image }}"

