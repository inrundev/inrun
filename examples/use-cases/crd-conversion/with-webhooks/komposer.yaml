apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: cronjob-production
  description: >
    Production Komposer for the CronJob pattern.
    Inherits all operator behavior from katalog.yaml.
    Overrides runtime tuning for production workloads.

imports:
  files:
    - url: ./katalog.yaml

spec:
  crds:
    cronjob-v2:
      operatorBox:
        reconcile:
          workers: 8
          resync: 15s

    cronjob-v1:
      operatorBox:
        reconcile:
          workers: 4
          resync: 15s

