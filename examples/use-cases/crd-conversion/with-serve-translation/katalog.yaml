apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: cronjob-operator
  description: >
    Single-version CronJob operator with serve layer field translation.
    Callers submit a flat cron string; serve.fields.values fans it out to the
    five structured schedule fields before the CR reaches the API server.
    No conversion webhook. No normalize. The translation lives at the serve layer.

gateway:
  endpoint: http://orkestra-gateway:8080
  api:
    enabled: true
    auth:
      tokens:
        - name: dev
          token: "${DEV_TOKEN}"

spec:
  crds:
    cronjob-tutorial:
      apiTypes:
        group: demo.orkestra.io
        version: v1
        kind: CronJob
        plural: cronjobs
      serve:
        enabled: true
        target: cronjob-tutorial
        namespace: default
        include: ./serve/cronjob.yaml
        tokens:
          dev:
            permissions:
              global: ["*"]
      admission:
        validation:
          rules:
            - field: "{{ cronValid .request.schedule }}"
              equals: true
              link: schedule
              fires:
                reconcile: false
              message: 'schedule must be a valid cron expression (e.g. "*/5 * * * *")'
              action: deny

            - field: spec.schedule
              operator: exists
              message: "schedule is required"
              action: deny

            - field: spec.image
              operator: exists
              message: "image is required"
              action: deny
        mutation:
          mutateFirst: true
          rules:
            - field: spec.concurrencyPolicy
              default: "Allow"
            - field: spec.successfulJobsHistoryLimit
              default: 3
              valueType: int
            - field: spec.failedJobsHistoryLimit
              default: 1
              valueType: int
            - field: spec.suspend
              default: false
      operatorBox:
        reconcile:
          workers: 5
          resync: 45s
          onCreate:
            cronJobs:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                schedule: "{{ cronFromAny .spec.schedule }}"
                suspend: "{{ .spec.suspend }}"
                successfulJobsHistoryLimit: "{{ .spec.successfulJobsHistoryLimit }}"
                failedJobsHistoryLimit: "{{ .spec.failedJobsHistoryLimit }}"
                concurrencyPolicy: "{{ .spec.concurrencyPolicy }}"
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: '{{ boolTernary .spec.suspend "Suspended" "Active" }}'
              - path: scheduleExpression
                value: "{{ cronFromAny .spec.schedule }}"
              - path: scheduleDescription
                value: "{{ cronDescribe .spec.schedule }}"
              - path: image
                value: "{{ .spec.image }}"
              - path: lastScheduleTime
                value: '{{ cronJobLastScheduleTime .children.cronjob }}'
              - path: nextScheduleTime
                value: '{{ cronJobNextScheduleTime .children.cronjob }}'

