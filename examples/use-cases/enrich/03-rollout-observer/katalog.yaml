apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: microservice-operator-rollout
  description: >
    Enrich pattern 03 — rollout observer.
    pods: always fetched.
    replicasets: only fetched when the deployment is not fully ready
                 OR when spec.debug is "true".
    In steady state, only pod-list runs. During a rollout (new image → old
    ReplicaSet scaling down) or debug mode, replicaset data is available
    and old/new replica counts appear in status.

spec:
  crds:
    microservice:
      crdFile: ../crd.yaml
      # ── Enrichment ───────────────────────────────────────────────────────────
      enrich:
        # pods: always — phase, pod count, crash detection.
        - pods

        # replicasets: only during rollouts (replicas not ready) or debug mode.
        # or: fetches when EITHER condition is true.
        - replicasets:
            or:
              - field: "{{ replicasReady .children.deployment }}"
                equals: "false"
              - field: spec.debug
                equals: "true"
      admission:
        validation:
          rules:
            - field: spec.image
              operator: exists
              message: "spec.image is required"
              action: deny
      operatorBox:
        reconcile:
          workers: 2
          resync: 15s
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists

              - path: phase
                value: "Rollout"
                when:
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "false"

              - path: phase
                value: "Ready"
                when:
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "true"

              # ── Pod notes (always available) ────────────────────────────────
              - path: podCount
                value: "{{ podCount .children.deployment }}"

              - path: readyPodCount
                value: "{{ readyPodCount .children.deployment }}"

              - path: hasCrashingPod
                value: "{{ hasCrashingPod .children.deployment }}"

              # ── ReplicaSet notes (only available when enrichment ran) ───────
              # replicaSetCount — how many ReplicaSets exist (>1 during rollout).
              - path: replicaSetCount
                value: "{{ deploymentReplicaSetCount .children.deployment }}"
                clearOnFalse: true
                when:
                  - field: "{{ replicasReady .children.deployment }}"
                    equals: "false"

              # oldReplicaSets — non-zero while old pods are still scaling down.
              - path: oldReplicaSets
                value: "{{ oldDeploymentReplicaSets .children.deployment }}"
                clearOnFalse: true
                when:
                  - field: "{{ replicasReady .children.deployment }}"
                    equals: "false"

              # Debug-mode rollout visibility — cleared when debug is turned off.
              - path: debugReplicaSetCount
                value: "{{ deploymentReplicaSetCount .children.deployment }}"
                clearOnFalse: true
                when:
                  - field: spec.debug
                    equals: "true"

