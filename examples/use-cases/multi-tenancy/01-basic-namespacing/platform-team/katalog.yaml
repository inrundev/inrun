apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: platform
  namespace: platform-team
  description: >
    Platform team Katalog — namespace: platform-team.
    Manages a Database CRD. The Control Center groups this Katalog under
    the "platform-team" panel, separate from other teams in the same runtime.

spec:
  crds:
    database:
      apiTypes:
        group: multi-tenancy.orkestra.io
        version: v1alpha1
        kind: Database
        plural: databases
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onCreate:
            secrets:
              - name: "{{ .metadata.name }}-creds"
                once: true
                rotateAfter: 90d
                data:
                  password: "{{ randomAlphanumeric 16 }}"

            services:
              - name: "{{ .metadata.name }}"
                port: "5432"
                targetPort: "5432"
                reconcile: true

            deployments:
              - name: "{{ .metadata.name }}"
                image: '{{ default "postgres:15" .spec.image }}'
                replicas: "1"
                port: "5432"
                env:
                  - name: POSTGRES_DB
                    value: "{{ .metadata.name }}"
                  - name: POSTGRES_USER
                    value: "{{ .metadata.name }}-user"
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: "{{ .metadata.name }}-creds"
                        key: password
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: endpoint
                value: "{{ .metadata.name }}.{{ .metadata.namespace }}.svc:5432"

