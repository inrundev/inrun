apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: internal
  namespace: internal-team
  description: >
    Internal team — crossAccess: false closes all CRDs to cross reads by default.
    The ledger CRD overrides back to crossAccess: true at the CRD level.

crossAccess: false

spec:
  crds:
    payment:
      apiTypes:
        group: multi-tenancy.orkestra.io
        version: v1alpha1
        kind: Payment
        plural: payments
      operatorBox:
        reconcile:
          workers: 3
          resync: 10s
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}-processor"
                image: "nginx:alpine"
                replicas: "2"
                port: "8080"
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "active"

    ledger:
      apiTypes:
        group: multi-tenancy.orkestra.io
        version: v1alpha1
        kind: Ledger
        plural: ledgers
      crossAccess: true
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}-ledger"
                image: "nginx:alpine"
                replicas: "1"
                port: "8080"
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: entryCount
                value: '{{ default "0" .spec.initialEntries }}'

