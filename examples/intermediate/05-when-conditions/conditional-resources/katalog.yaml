apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: platform-operator
  author: orkspace
  version: 0.1.0
  description: >
    Demonstrates when: conditions — conditional resource creation based on
    the CR's current state. The same CRD produces different resources at
    different tier values without any operator logic changes.

spec:
  crds:
    platform:
      crdFile: ./crd.yaml
      operatorBox:
        reconcile:
          onCreate:
            # ── Deployment — always created (all tiers) ────────────────────
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: "{{ .spec.port }}"
                reconcile: true
                # No when: block — this resource is unconditional

            # ── ClusterIP Service — always created (all tiers) ────────────
            services:
              - name: "{{ .metadata.name }}-internal"
                type: ClusterIP
                port: "80"
                targetPort: "{{ .spec.port }}"
                reconcile: true

            # ── LoadBalancer — only for pro and enterprise ─────────────────
            # Free tier gets no external access
              - name: "{{ .metadata.name }}-lb"
                type: LoadBalancer
                port: "443"
                targetPort: "{{ .spec.port }}"
                reconcile: true
                when:
                  - field: spec.tier
                    notEquals: free

            # ── Monitoring ConfigMap — only when monitoring: true ──────────
            configMaps:
              - name: "{{ .metadata.name }}-monitoring"
                data:
                  ENABLE_METRICS: "true"
                  SCRAPE_INTERVAL: "15s"
                reconcile: true
                when:
                  - field: spec.monitoring
                    equals: "true"

            # ── Enterprise ConfigMap — only enterprise tier ────────────────
              - name: "{{ .metadata.name }}-enterprise-config"
                data:
                  RATE_LIMIT_RPS: "10000"
                  CACHE_SIZE_MB: "1024"
                  PRIORITY_QUEUE: "true"
                reconcile: true
                when:
                  - field: spec.tier
                    equals: enterprise
        emit:
          status:
            fields:
              - path: tier
                value: "{{ .spec.tier }}"
              - path: phase
                value: "Running"
              - path: readyReplicas
                value: "{{ get .children.deployment \"status\" \"readyReplicas\" }}"

