apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: platform-komposer
  author: orkspace
  version: 0.1.0
  description: >
    Composes two Katalogs from local files into one runtime.
    The spec.crds block overrides the website CRD with production-tuned settings.

# ── Sources ────────────────────────────────────────────────────────────────
# Orkestra merges all sources into one unified CRD entry list.
# Sources are resolved in order. Later sources win on name conflict —
# EXCEPT for spec.crds below, which always wins over everything.
imports:
  files:
    - ./website-katalog.yaml        # base website operator
    - ./namespace-katalog.yaml      # namespace governance

# ── Overrides ──────────────────────────────────────────────────────────────
# spec.crds entries override matching entries from sources by name.
# Use this for environment-specific tuning without modifying the base Katalog.
spec:
  crds:
    website:
      apiTypes:
        group: demo.orkestra.io
        version: v1alpha1
        kind: Website
        plural: websites
      # All other fields (reconciler, status, onCreate) are inherited from
      # website-katalog.yaml — only overridden fields change
      operatorBox:
        reconcile:
          workers: 4        # production: more workers than the base katalog's 2
          resync: 15s       # production: faster resync than the base katalog's 30s

