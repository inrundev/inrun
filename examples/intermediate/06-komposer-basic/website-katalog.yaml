apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: website-base
  author: orkspace
  version: 0.1.0
  description: Base website operator — shared across environments

spec:
  crds:
    website:
      apiTypes:
        group: demo.orkestra.io
        version: v1alpha1
        kind: Website
        plural: websites
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onCreate:
            deployments:
              - image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                reconcile: true
            services:
              - port: "80"
                targetPort: "{{ .spec.port }}"
                reconcile: true
          default: true
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: endpoint
                value: "{{ .metadata.name }}.{{ .metadata.namespace }}.svc.cluster.local"

