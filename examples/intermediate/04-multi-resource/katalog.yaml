apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: application-operator
  author: orkspace
  version: 0.1.0
  description: >
    Deployment + Service + ConfigMap.
    Status Layer 3: readyReplicas propagated from the Deployment's live status.

spec:
  crds:
    application:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      operatorBox:
        reconcile:
          workers: 3
          resync: 15s
          onCreate:
            # ── Deployment ─────────────────────────────────────────────────
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: "{{ .spec.port }}"
                reconcile: true

            # ── Service ────────────────────────────────────────────────────
            services:
              - name: "{{ .metadata.name }}-svc"
                port: "80"
                targetPort: "{{ .spec.port }}"
                reconcile: true

            # ── ConfigMap ──────────────────────────────────────────────────
            # Configuration that the Deployment reads via envFrom.
            # reconcile: true means if you change spec.logLevel or
            # spec.maxConnections, the ConfigMap is updated automatically.
            configMaps:
              - name: "{{ .metadata.name }}-config"
                data:
                  LOG_LEVEL: "{{ .spec.logLevel }}"
                  MAX_CONNECTIONS: "{{ .spec.maxConnections }}"
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: observedReplicas
                value: "{{ .spec.replicas }}"
              - path: endpoint
                value: "{{ .metadata.name }}.{{ .metadata.namespace }}.svc.cluster.local"
              # Layer 3 — reads back from the Deployment after reconcile
              - path: readyReplicas
                value: "{{ get .children.deployment \"status\" \"readyReplicas\" }}"
              - path: availableReplicas
                value: "{{ get .children.deployment \"status\" \"availableReplicas\" }}"
        # ── Status ───────────────────────────────────────────────────────
        # Layer 1: Ready condition — automatic
        # Layer 2: fields from the CR spec
        # Layer 3: readyReplicas from the child Deployment's live status

