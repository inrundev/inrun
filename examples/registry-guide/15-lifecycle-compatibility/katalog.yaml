apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-operator
  version: v1.2.0
  description: >
    WebApp operator v1.2.0 — stable, with compatibility constraints declaring the
    verified Kubernetes and Orkestra version ranges.
  author: myorg
  license: Apache-2.0

lifecycle:
  maturity: stable
  compatibility:
    kubernetes: ">=1.28"   # verified against Kubernetes 1.28 and above
    orkestra: ">=0.7.0"    # verified against Orkestra 0.7.0 and above

spec:
  crds:
    webapp:
      crdFile: ./crd.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 1m
          imports:
            - motif: ../01-motifs/web-service/motif.yaml
              with:
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                replicas: "{{ .spec.replicas }}"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"

