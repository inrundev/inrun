apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: app-platform
  author: myorg
  version: v1.0.0
  description: >
    Compose the webapp, cache, and platform-app operators into a single Orkestra binary.
    One process manages three CRDs: WebApp, Cache, and PlatformApp. Gateway enabled for
    synchronous admission enforcement and deletion protection.

imports:
  registry:
    - oci://ghcr.io/myorg/katalogs/webapp-operator:v1.0.0
  files:
    - ../03-katalog-cache/katalog.yaml
    - ../04-katalog-platform/katalog.yaml

gateway:
  endpoint: http://orkestra-gateway.orkestra-system.svc:8080

security:
  webhooks:
    admission:
      enabled: true
  deletionProtection:
    enabled: true

spec:
  crds:
    webapp:
      operatorBox:
        reconcile:
          workers: 4
          resync: 30s

    cache:
      operatorBox:
        reconcile:
          workers: 1
          resync: 10s

    platformapp:
      operatorBox:
        reconcile:
          workers: 5
          resync: 45s

