apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: full-platform
  version: v1.0.0
  description: >
    Combine the declarative webapp + cache operators with the typed database
    operator into a single Orkestra binary. One process, three CRDs.

imports:
  registry:
    - oci://ghcr.io/myorg/katalogs/webapp-operator:v2.0.0
    - oci://ghcr.io/myorg/katalogs/cache-operator:v1.0.0
    - oci://ghcr.io/myorg/katalogs/database-operator:v1.0.0

# Environment overrides — tune for production without changing the source katalogs.
spec:
  crds:
    webapp:
      operatorBox:
        reconcile:
          workers: 4
          resync: 30s

    cache:
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s

    database:
      operatorBox:
        reconcile:
          workers: 3
          resync: 30s
