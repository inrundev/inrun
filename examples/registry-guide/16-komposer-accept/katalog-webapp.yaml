apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-operator
  version: v1.0.0
  description: >
    WebApp operator v1.0.0 — deprecated in favour of v2.0.0.
  author: myorg
  license: Apache-2.0

lifecycle:
  maturity: deprecated
  deprecation:
    migratedTo: ghcr.io/myorg/katalogs/webapp@v2.0.0
    message: "Migrate to v2.0.0 before 2027-01-01."
    timeline:
      from: "2026-01-01"
      to: "2027-01-01"

spec:
  crds:
    webapp:
      crdFile: ./crd.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 1m
          imports:
            - motif: ../01-motifs/web-service/motif.yaml
              with:
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                replicas: "{{ .spec.replicas }}"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"

