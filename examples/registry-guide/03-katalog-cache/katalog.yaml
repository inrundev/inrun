apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: cache-operator
  namespace: platform-team
  version: v1.0.0
  description: >
    Cache operator built from the data-store motif. Exposes a Cache CRD that
    runs any key-value or cache image as a StatefulSet with persistent storage
    and auto-rotated credentials. Works with Redis, Memcached, Valkey, and others.
  author: myorg
  license: Apache-2.0
  tags:
    - cache
    - redis
    - statefulset
    - storage
    - credentials

spec:
  crds:
    cache:
      apiTypes:
        group: rkguide.demo
        version: v1
        kind: Cache
        plural: caches
      operatorBox:
        reconcile:
          workers: 2
          resync: 1m
          imports:
            - motif: ../01-motifs/data-store/motif.yaml
              with:
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                storageSize: "{{ .spec.storageSize }}"
                storageClass: "{{ .spec.storageClass }}"
                replicas: "{{ .spec.replicas }}"
                resourceProfile: "{{ .spec.resourceProfile }}"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: ready
                value: "{{ allReplicasReady .children.statefulset }}"
              - path: connectionSecret
                value: "{{ .metadata.name }}-creds"
              - path: endpoint
                value: "{{ .metadata.name }}-svc.{{ .metadata.namespace }}.svc.cluster.local:{{ .spec.port }}"

