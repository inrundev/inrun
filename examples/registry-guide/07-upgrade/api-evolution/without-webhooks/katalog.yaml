apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-operator
  namespace: api-team
  version: v1.2.0
  description: >
    WebApp operator v1.2.0. The CRD accepts both the original flat format
    (spec.port, spec.host) and the new structured format (spec.expose.port,
    spec.expose.host). normalize collapses both into the canonical shape before
    any reconcile logic runs. No conversion webhook. No multi-version CRD.
    No TLS. No cert-manager.
  author: myorg
  license: Apache-2.0
  tags:
    - web
    - stateless
    - ingress

spec:
  crds:
    webapp:
      apiTypes:
        group: rkguide.demo
        version: v1
        kind: WebApp
        plural: webapps
      # normalize runs before mutation, validation, and template rendering.
      # Produces an in-memory canonical spec — the raw CR in etcd is unchanged.
      # After this block, .spec.expose.port is always set regardless of input format.
      operatorBox:
        reconcile:
          workers: 2
          resync: 1m
          normalize:
            spec:
              # v2: spec.expose present → use expose.port directly
              # v1: spec.expose absent  → lift spec.port
              expose.port: '{{ if .spec.expose }}{{ .spec.expose.port }}{{ else }}{{ .spec.port }}{{ end }}'
              # v2: spec.expose present → use expose.host directly
              # v1: spec.expose absent  → lift spec.host
              expose.host: '{{ if .spec.expose }}{{ .spec.expose.host | default "" }}{{ else }}{{ .spec.host | default "" }}{{ end }}'
          imports:
            - motif: oci://ghcr.io/myorg/motifs/web-service:v1.1.0
              with:
                image:    "{{ .spec.image }}"
                port:     "{{ .spec.expose.port }}"
                host:     "{{ .spec.expose.host }}"
                replicas: "{{ .spec.replicas }}"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: ready
                value: "{{ allReplicasReady .children.deployment }}"
              - path: port
                value: "{{ .spec.expose.port }}"
              - path: specFormat
                value: '{{ ternary (ne .spec.port nil) "flat (deprecated)" "structured" }}'
              - path: endpoint
                value: "http://{{ .metadata.name }}-svc.{{ .metadata.namespace }}.svc.cluster.local"

