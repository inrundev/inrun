apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-operator
  namespace: api-team
  version: v2.0.0
  description: >
    WebApp operator v2.0.0. The CRD API evolves: spec.port + spec.host move into
    spec.expose for clarity and extensibility. spec.expose.protocol is new in v2.
    Orkestra Gateway handles lossless bidirectional conversion — existing v1 clients
    (CI pipelines, Terraform) continue working unchanged. No separate webhook pod.
    No TLS management. No Go.
  author: ialexeze
  license: Apache-2.0
  tags:
    - web
    - stateless
    - ingress
    - conversion

security:
  conversion:
    enabled: true

gateway:
  endpoint: http://orkestra-gateway.orkestra-system.svc:8080

spec:
  crds:
    # ── v2 — storage version ──────────────────────────────────────────────
    # All objects live here. The API server calls /convert when a request
    # arrives in v1. Orkestra handles conversion in-process.
    webapp-v2:
      apiTypes:
        group: rkguide.demo
        version: v2
        kind: WebApp
        plural: webapps
      # ── Lossless bidirectional conversion ────────────────────────────────
      #
      # v1 → v2: lift flat fields into the expose struct
      #   spec.port  → spec.expose.port  (integer → string)
      #   spec.host  → spec.expose.host
      #   spec.expose.protocol defaults to HTTP when converting from v1
      #
      # v2 → v1: flatten expose back to top-level fields
      #   spec.expose.port → spec.port
      #   spec.expose.host → spec.host
      #   spec.expose.protocol is dropped (no v1 equivalent)
      #
      # Import the web-service motif — unchanged from v1.1.0.
      # All downstream logic uses v2 spec (storage format).
      admission:
        conversion:
          storageVersion: v1
          updateCRD: true
          paths:
            - from: v1
              to: v2
              spec:
                image:    "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                expose:
                  port:     "{{ .spec.port }}"
                  host:     '{{ default "" .spec.host }}'
                  protocol: HTTP

            - from: v2
              to: v1
              spec:
                image:    "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port:     "{{ .spec.expose.port }}"
                host:     '{{ default "" .spec.expose.host }}'
      operatorBox:
        reconcile:
          workers: 2
          resync: 1m
          imports:
            - motif: oci://ghcr.io/myorg/motifs/web-service:v1.1.0
              with:
                image:    "{{ .spec.image }}"
                port:     "{{ .spec.expose.port }}"
                host:     "{{ .spec.expose.host }}"
                replicas: "{{ .spec.replicas }}"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: ready
                value: "{{ allReplicasReady .children.deployment }}"
              - path: endpoint
                value: "http://{{ .metadata.name }}-svc.{{ .metadata.namespace }}.svc.cluster.local"
              - path: protocol
                value: "{{ .spec.expose.protocol }}"

    # ── v1 — legacy API surface ───────────────────────────────────────────
    # Objects written as v1 are converted to v2 before storage.
    # Objects read as v1 are converted from v2 on the way out.
    # This entry ensures Orkestra watches v1 events and shows conversion
    # stats in the Control Center.
    webapp-v1:
      apiTypes:
        group: rkguide.demo
        version: v1
        kind: WebApp
        plural: webapps
      admission:
        conversion:
          participant: true
      operatorBox:
        reconcile:
          workers: 2
          resync: 1m
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: endpoint
                value: "http://{{ .metadata.name }}-svc.{{ .metadata.namespace }}.svc.cluster.local"

