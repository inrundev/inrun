apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-operator
  namespace: api-team
  version: v1.1.0
  description: >
    WebApp operator v1.1.0. Follows the web-service motif upgrade to v1.1.0,
    exercising the new probeProfile and probePath inputs. Backwards-compatible:
    existing CRs without these fields continue to work via motif defaults.
  author: myorg
  license: Apache-2.0
  tags:
    - web
    - stateless
    - ingress

spec:
  crds:
    webapp:
      apiTypes:
        group: rkguide.demo
        version: v1
        kind: WebApp
        plural: webapps
      operatorBox:
        reconcile:
          workers: 2
          resync: 1m
          imports:
            - motif: oci://ghcr.io/myorg/motifs/web-service:v1.1.0   # bumped from v1.0.0
              with:
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                replicas: "{{ .spec.replicas }}"
                host: "{{ .spec.host }}"
                resourceProfile: "{{ .spec.resourceProfile }}"
                probeProfile: "{{ .spec.probeProfile }}"             # new in v1.1.0
                probePath: "{{ .spec.probePath }}"                   # new in v1.1.0
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: ready
                value: "{{ allReplicasReady .children.deployment }}"
              - path: endpoint
                value: "http://{{ .metadata.name }}-svc.{{ .metadata.namespace }}.svc.cluster.local"

