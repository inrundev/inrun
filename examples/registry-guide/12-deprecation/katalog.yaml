apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: webapp-operator
  version: v1.0.0
  description: >
    WebApp operator v1.0.0 — deprecated in favour of v2.0.0 which uses
    spec.healthPath and enforces internal registry images.
  author: myorg
  license: Apache-2.0
  tags:
    - web
    - stateless
    - deprecated

lifecycle:
  maturity: deprecated
  deprecation:
    migratedTo: ghcr.io/myorg/katalogs/webapp@v2.0.0
    message: "v1.0.0 is end-of-life. Migrate to v2.0.0: add spec.healthPath to your CRs."
    timeline:
      from: "2025-01-01"
      to: "2026-06-01"

spec:
  crds:
    webapp:
      crdFile: ./crd-v1.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 1m
          imports:
            - motif: oci://ghcr.io/myorg/motifs/web-service:v1.1.0
              with:
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                replicas: "{{ .spec.replicas }}"
                host: "{{ .spec.host }}"
                resourceProfile: "{{ .spec.resourceProfile }}"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: ready
                value: "{{ allReplicasReady .children.deployment }}"

