apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: platform-app-operator
  namespace: platform-team
  version: v1.0.0
  description: >
    WebApp with platform admission policies applied. Imports two motifs: the
    web-service motif for resources and the platform-admission motif for policy.
    Images must come from the internal registry; replicas are bounded.
  author: myorg
  license: Apache-2.0
  tags:
    - web
    - stateless
    - admission
    - policy
    - platform

spec:
  crds:
    platformapp:
      apiTypes:
        group: rkguide.demo
        version: v1
        kind: PlatformApp
        plural: platformapps
      operatorBox:
        reconcile:
          workers: 2
          resync: 1m
          imports:
            # Resources: Deployment + Service + optional Ingress
            - motif: oci://ghcr.io/myorg/motifs/web-service:v1.0.0
              with:
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                replicas: "{{ .spec.replicas }}"
                host: "{{ .spec.host }}"
                resourceProfile: "{{ .spec.resourceProfile }}"

            # Policy: image registry enforcement + replica bounds + team label advisory
            - motif: oci://ghcr.io/myorg/motifs/platform-admission:v1.0.0
              with:
                allowedRegistry: "ghcr.io/orkspace/"
                maxReplicas: "10"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: ready
                value: "{{ allReplicasReady .children.deployment }}"
              - path: endpoint
                value: "http://{{ .metadata.name }}-svc.{{ .metadata.namespace }}.svc.cluster.local"

