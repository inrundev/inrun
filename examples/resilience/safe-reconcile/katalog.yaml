# Schema reference: https://orkestra.sh/docs/reference/schema/katalog/
apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: safe-reconcile
  author: orkspace
  version: 0.1.0
  description: >
    Demonstrates safeReconcile — Orkestra's panic isolation boundary.
    Two declarative CRDs (Monitor, Queue) reconcile cleanly.
    One typed CRD (App) has an intentional nil pointer dereference in its hook.
    The operator stays running. Monitor and Queue are unaffected.
  tags:
    - security
    - resilience
    - hooks
    - typed

spec:
  crds:
    monitor:
      apiTypes:
        group: safe.demo.orkestra.io
        version: v1alpha1
        kind: Monitor
        plural: monitors
      operatorBox:
        reconcile:
          resync: 30s
          onCreate:
            configMaps:
              - name: "{{ .metadata.name }}-monitor-config"
                reconcile: true
                data:
                  interval: "{{ .spec.interval }}"
                  endpoint: "{{ .spec.endpoint }}"
        emit:
          status:
            fields:
              - path: phase
                value: "Watching"
              - path: interval
                value: "{{ .spec.interval }}"

    queue:
      apiTypes:
        group: safe.demo.orkestra.io
        version: v1alpha1
        kind: Queue
        plural: queues
      operatorBox:
        reconcile:
          resync: 30s
          onCreate:
            configMaps:
              - name: "{{ .metadata.name }}-queue-config"
                reconcile: true
                data:
                  maxSize: "{{ .spec.maxSize }}"
                  processingTimeout: "{{ .spec.processingTimeout }}"
        emit:
          status:
            fields:
              - path: phase
                value: "Ready"
              - path: maxSize
                value: "{{ .spec.maxSize }}"

    app:
      apiTypes:
        group: safe.demo.orkestra.io
        version: v1alpha1
        kind: App
        plural: apps
        object: App
        objectList: AppList
        location: github.com/orkspace/safe-reconcile-demo/api/v1alpha1
        alias: safev1alpha1
      operatorBox:
        reconcile:
          hooks:
            location: github.com/orkspace/safe-reconcile-demo/hooks
            function: AppHooks
            alias: safehooks
            managedResources:
              - kind: Deployment
          resync: 30s

