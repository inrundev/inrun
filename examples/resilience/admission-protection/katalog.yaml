apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: blockchain-operator
  version: 0.1.0
  description: BlockchainApp operator with runtime admission — validates every CR on every reconcile.

spec:
  crds:
    blockchainapp:
      crdFile: ./crd.yaml
      admission:
        validation:
          rules:
            - field: spec.image
              prefix: "myorg/"
              message: "images must come from the internal registry (myorg/)"
              action: deny
            - field: spec.replicas
              greaterThan: 0
              message: "replicas must be at least 1"
              action: deny
        mutation:
          rules:
            - field: spec.replicas
              default: 1
              valueType: int
            - field: spec.port
              default: 8545
              valueType: int
      operatorBox:
        reconcile:
          queue:
            failureThreshold: 3
          onCreate:
            statefulSets:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                reconcile: true
            services:
              - name: "{{ .metadata.name }}-rpc"
                port: "{{ .spec.port }}"
                targetPort: "{{ .spec.port }}"
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: nodeCount
                value: '{{ .spec.replicas }}'

