apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: blockchain-operator
  version: 0.1.0
  description: BlockchainApp operator — demonstrates runtime CRD watch and recovery without deletion protection.

spec:
  crds:
    blockchainapp:
      crdFile: ./crd.yaml
      admission:
        mutation:
          rules:
            - field: spec.replicas
              default: 1
              valueType: int
            - field: spec.port
              default: 8545
              valueType: int
      operatorBox:
        reconcile:
          onCreate:
            statefulSets:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                reconcile: true
            services:
              - name: "{{ .metadata.name }}-rpc"
                port: "{{ .spec.port }}"
                targetPort: "{{ .spec.port }}"
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: nodeCount
                value: '{{ .spec.replicas }}'

