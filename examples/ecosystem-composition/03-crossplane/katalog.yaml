# Schema reference: https://orkestra.sh/docs/reference/schema/katalog/
apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: infra-operator
  author: myorg
  version: 0.1.0
  description: >
    Infra operator — wraps Crossplane. An Infra CR creates a Crossplane Composite
    Claim. Teams declare type, size, and region. Orkestra handles the composition
    selector, parameter mapping, and connection secret naming.
  tags:
    - ecosystem
    - crossplane
    - infrastructure

spec:
  crds:
    infra:

      apiTypes:
        group: ecosystem.demo.orkestra.io
        version: v1alpha1
        kind: Infra
        plural: infras
      # Enforced at admission time (gateway webhook) AND every reconcile cycle.
      # A CR that fails a deny rule is rejected before it is stored.
      # If the gateway is absent, reconcile halts — no Claim is ever created.
      admission:
        validation:
          rules:
            # Hard rule — only registered teams can provision infrastructure
            - field: spec.team
              operator: in
              value: "platform,backend,frontend,data,security"
              message: "team must be a registered platform team; update this list in the Katalog to match your org"
              action: deny

            # Hard rule — only approved cloud regions
            - field: spec.region
              operator: in
              value: "us-east-1,us-west-2,eu-west-1,eu-central-1,ap-southeast-1"
              message: "region must be one of: us-east-1, us-west-2, eu-west-1, eu-central-1, ap-southeast-1"
              action: deny
      operatorBox:
        reconcile:
          onCreate:
            custom:
              # Replace database.myorg.io/v1alpha1 PostgreSQLInstance with your
              # Crossplane Composite type. Map the fields below to your composition's
              # parameters block. See README for reference.
              # The Claim is only created once spec.approved is set to true.
              # The Infra CR can be created without it — it documents intent.
              # Provisioning is gated. The gate is at the resource level.
              - apiVersion: database.myorg.io/v1alpha1
                kind: PostgreSQLInstance
                when:
                  - field: spec.approved
                    equals: "true"
                metadata:
                  name: "{{ .metadata.name }}"
                  namespace: "{{ .metadata.namespace }}"
                spec:
                  parameters:
                    # boolTernary maps size class → storageGB: large=100, medium=50, small=20
                    storageGB: "{{ boolTernary (eq .spec.size \"large\") 100 (boolTernary (eq .spec.size \"medium\") 50 20) }}"
                    region: "{{ .spec.region }}"
                  compositionSelector:
                    matchLabels:
                      provider: aws
                      team: "{{ .spec.team }}"
                  writeConnectionSecretToRef:
                    name: "{{ .metadata.name }}-conn"
                hasStatus: true
        emit:
          status:
            fields:
              - path: connectionSecret
                value: "{{ .metadata.name }}-conn"
              - path: ready
                value: '{{ (index .children.customs (printf "%s" .metadata.name)).status.conditions | default "" }}'
        runtime:
          allowedNamespaces:
            - default

