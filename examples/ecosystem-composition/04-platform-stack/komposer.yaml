# Schema reference: https://orkestra.sh/docs/reference/schema/komposer/
apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: platform-stack
  author: myorg
  version: 0.1.0
  description: >
    Platform stack — App + SecurityConfig + MonitoringConfig + Infra in one runtime.
    Four ecosystem tools (ArgoCD, cert-manager, Prometheus Operator, Crossplane) composed
    under one control plane with gateway admission enforcement and deletion protection.

imports:
  registry:
    - oci://ghcr.io/myorg/katalogs/app-operator:0.1.0
    - oci://ghcr.io/myorg/katalogs/security-operator:0.1.0
    - oci://ghcr.io/myorg/katalogs/monitoring-operator:0.1.0
    - oci://ghcr.io/myorg/katalogs/infra-operator:0.1.0

gateway:
  endpoint: http://orkestra-gateway.orkestra-system.svc:8080

security:
  webhooks:
    admission:
      enabled: true
  deletionProtection:
    enabled: false

spec:
  crds:
    app:
      operatorBox:
        reconcile:
          workers: 3
          resync: 30s

    securityconfig:
      operatorBox:
        reconcile:
          workers: 2
          resync: 60s

    monitoringconfig:
      operatorBox:
        reconcile:
          workers: 2
          resync: 60s

    infra:
      operatorBox:
        reconcile:
          workers: 2
          resync: 60s

