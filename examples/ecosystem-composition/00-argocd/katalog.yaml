# Schema reference: https://orkestra.sh/docs/reference/schema/katalog/
apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: app-operator
  author: myorg
  version: 0.1.0
  description: >
    App operator — wraps ArgoCD. An App CR creates an ArgoCD Application.
    Teams declare repo, branch, and namespace. Orkestra handles the Application spec.
    Ownership is enforced — every App must declare a team label before ArgoCD sees it.
  tags:
    - ecosystem
    - argocd
    - gitops

spec:
  crds:
    app:

      apiTypes:
        group: ecosystem.demo.orkestra.io
        version: v1alpha1
        kind: App
        plural: apps
      admission:
        validation:
          rules:
            # Hard rule — every App must declare team ownership before ArgoCD sees it
            - field: metadata.labels.team
              operator: exists
              message: "declare metadata.labels.team — all apps must declare ownership before they are deployed"
              action: deny

            # Hard rule — only deploy to namespaces your team owns; kube-system and orkestra-system are off limits
            - field: spec.targetNamespace
              operator: in
              value: "default,staging,production,preview"
              message: "targetNamespace must be one of: default, staging, production, preview"
              action: deny
      operatorBox:
        reconcile:
          onReconcile:
            custom:
              - apiVersion: argoproj.io/v1alpha1
                kind: Application
                metadata:
                  name: "{{ .metadata.name }}"
                  namespace: argocd
                spec:
                  project: default
                  source:
                    repoURL: "https://{{ .spec.repo }}"
                    targetRevision: "{{ .spec.branch }}"
                    path: "{{ .spec.path }}"
                  destination:
                    server: https://kubernetes.default.svc
                    namespace: "{{ .spec.targetNamespace }}"
                  syncPolicy:
                    automated:
                      prune: true
                      selfHeal: true
                hasStatus: true
        emit:
          status:
            fields:
              - path: syncStatus
                value: '{{ with (index .children.customs .metadata.name) }}{{ .status.sync.status }}{{ end }}'
              - path: health
                value: '{{ with (index .children.customs .metadata.name) }}{{ .status.health.status }}{{ end }}'

