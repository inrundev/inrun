apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: autoscale-from-external-api
  author: orkspace
  version: 0.1.0
  description: >
    Autoscaling based on an external workload's metrics endpoint.

    A payment processor operator scales based on the queue depth of the payment
    system — not its own metrics, not a sibling Orkestra operator, but an external
    HTTP endpoint. The dev server simulates the payment system.

    When the payment system queue depth exceeds 60, Processor scales up workers
    and tightens its resync interval. After a cooldown period it returns to baseline.

    The endpoint returns { "metrics": { "queueDepth": <n>, ... } } — the same
    shape as any Orkestra /katalog/{crd} response. Flip the load with:

      curl -X POST http://localhost:9999/autoscale-metrics/flip

spec:
  crds:
    processor:
      apiTypes:
        group: external.orkestra.io
        version: v1alpha1
        kind: Processor
        plural: processors
      operatorBox:
        reconcile:
          workers: 2
          resync: 10s
          onCreate:
            deployments:
              - image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: 9090
                reconcile: true
            services:
              - port: "9090"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: autoscaleActive
                value: "{{ .metrics.autoscaleActive }}"
              - path: workers
                value: "{{ .metrics.workers }}"
        runtime:
          autoscale:
            interval: 10s
            cooldown: 3m
            conditions:
              when:
                - field: cross.paymentSystem.metrics.queueDepth
                  greaterThan: "60"
            do:
              workers: 8
              queueDepth: 800
              resync: 10s
        observe:
          cross:
            - crd: payment-system
              source:
                endpoint: "http://localhost:9999/autoscale-metrics"
                cacheFor: 20s
              as: paymentSystem

