apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: without-autoscaler
  author: orkspace
  version: 0.1.0
  description: >
    Same Ingestor pattern but without the autoscaler enabled.
    Useful for demonstrating baseline behaviour before autoscaling
    is introduced.

spec:
  crds:
    ingestor:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 60s
          queue:
            maxDepth: 100
            behaviour:
              onLimit:
                drop: true
          onCreate:
            deployments:
              - image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: 8080
                reconcile: true
            services:
              - port: "8080"
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: autoscaleActive
                value: "{{ .metrics.autoscaleActive }}"
              - path: workers
                value: "{{ .metrics.workers }}"

