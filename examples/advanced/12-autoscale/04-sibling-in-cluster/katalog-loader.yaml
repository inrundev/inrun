apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: loader-autoscale-sibling-in-cluster
  author: orkspace
  version: 0.1.0
  description: >
    Cross-binary autoscaling within the same cluster.

    Loader runs in loader-system under its own Orkestra deployment.
    Processor runs in processor-system under a separate Orkestra deployment.

spec:
  crds:
    # ── Loader (loader-system deployment) ─────────────────────────────────────
    # Fixed concurrency — this is the load source, not the scaling target.
    loader:
      apiTypes:
        group: autoscale.orkestra.io
        version: v1alpha1
        kind: Loader
        plural: loaders
      operatorBox:
        reconcile:
          workers: 3
          resync: 60s
          onCreate:
            deployments:
              - image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: 8080
                reconcile: true
            services:
              - port: "8080"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"

