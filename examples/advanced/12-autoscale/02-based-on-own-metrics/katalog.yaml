apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: autoscale-own-metrics
  author: orkspace
  version: 0.1.0
  description: >
    Autoscaling based on the CRD's own queue depth.
    When the Ingestor's reconcile queue exceeds 80 items, Orkestra
    scales workers from 2 to 8 and tightens the resync interval.
    Baseline is restored after a 2-minute cooldown.

spec:
  crds:
    ingestor:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 60s
          onCreate:
            deployments:
              - image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: 8080
                reconcile: true
            services:
              - port: "8080"
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: autoscaleActive
                value: "{{ .metrics.autoscaleActive }}"
              - path: workers
                value: "{{ .metrics.workers }}"
        runtime:
          autoscale:
            interval: 15s
            cooldown: 2m
            conditions:
              when:
                - field: metrics.queueDepth
                  greaterThan: "80"
            do:
              workers: 8
              queueDepth: 500
              resync: 10s

