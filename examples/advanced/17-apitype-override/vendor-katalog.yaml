apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: vendor-cluster-katalog
  description: >
    Vendor-shipped Katalog for the DatabaseCluster CRD.
    Operators import this file — they never modify it directly.
    Use a Komposer to override apiTypes and point at your own CRD.

spec:
  crds:
    db-cluster:
      apiTypes:
        group: vendor.example.io
        version: v1alpha1
        kind: DatabaseCluster
        plural: databaseclusters
      operatorBox:
        reconcile:
          workers: 2
          resync: 45s
          onCreate:
            statefulSets:
              - replicas: "{{ .spec.nodes }}"
                image: "{{ .spec.image }}"
                port: 5432
                reconcile: true
            services:
              - port: "5432"
                targetPort: "5432"
            configMaps:
              - name: "{{ .metadata.name }}-config"
                data:
                  ENGINE: "{{ .spec.engine }}"
                  NODES: "{{ .spec.nodes }}"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: engine
                value: "{{ .spec.engine }}"
              - path: nodes
                value: "{{ .spec.nodes }}"

