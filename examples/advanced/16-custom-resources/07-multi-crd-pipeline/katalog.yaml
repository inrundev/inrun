apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: autoscale-sibling
  author: orkspace
  version: 0.1.0
  description: >
    Pipeline orchestrates three autoscale CRDs (Loader, Processor, Auditor)
    by creating them declaratively via onCreate.custom.

spec:
  crds:
    pipeline:
      crdFile: ./crd-pipeline.yaml
      operatorBox:
        reconcile:
          imports:
            - motif: ./pipeline-motif.yaml
              with:
                processorImage: python:3.12
                auditMode: Strict
                replicas: 3

    # ── Loader ────────────────────────────────────────────────────────────────
    loader:
      crdFile: ./crd-loader.yaml
      operatorBox:
        reconcile:
          workers: 3
          resync: 60s
          onCreate:
            deployments:
              - image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: 8080
                reconcile: true
            services:
              - port: "8080"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"

    # ── Processor ────────────────────────────────────────────────────────────
    processor:
      crdFile: ./crd-processor.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onCreate:
            deployments:
              - image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: 9090
                reconcile: true
            services:
              - port: "9090"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"

    # ── Auditor ────────────────────────────────────────────────────────────
    auditor:
      crdFile: ./crd-auditor.yaml
      operatorBox:
        reconcile:
          workers: 1
          resync: 60s
          onCreate:
            configMaps:
              - name: "{{ .metadata.name }}-audit-config"
                data:
                  AUDIT_MODE: "{{ .spec.auditMode }}"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"

