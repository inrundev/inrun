apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: appenvironment-operator
  author: orkspace
  version: 0.1.0
  description: >
    AppEnvironment operator: demonstrates when: conditions on custom resource blocks.
    CacheCluster is only created when spec.cache.enabled == "true".
    SearchIndex is only created when spec.search.enabled == "true".
    This allows a single CRD to represent both lean dev and full prod environments.

spec:
  crds:

    # ── AppEnvironment ─────────────────────────────────────────────────────────
    appenvironment:
      crdFile: ./crd-appenvironment.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 60s
          onCreate:
            custom:

              # ── CacheCluster (conditional) ─────────────────────────────────────
              # This child CR is only created when spec.cache.enabled == "true".
              # If the flag is "false" or absent, Orkestra skips this entry entirely.
              # If you later update the parent to enable cache, Orkestra creates it
              # on the next reconcile.
              - apiVersion: platform.example.io/v1alpha1
                kind: CacheCluster
                when:
                  - field: spec.cache.enabled
                    equals: "true"
                metadata:
                  name: "{{ .metadata.name }}-cache"
                  namespace: "{{ .metadata.namespace }}"
                  namespaced: true
                  labels:
                    platform.example.io/environment: "{{ .metadata.name }}"
                    platform.example.io/tier: "{{ .spec.tier }}"
                spec:
                  size: "{{ .spec.cache.size }}"
                  ttl: "{{ .spec.cache.ttl }}"
                hasStatus: false

              # ── SearchIndex (conditional) ──────────────────────────────────────
              # This child CR is only created when spec.search.enabled == "true".
              - apiVersion: platform.example.io/v1alpha1
                kind: SearchIndex
                when:
                  - field: spec.search.enabled
                    equals: "true"
                metadata:
                  name: "{{ .metadata.name }}-search"
                  namespace: "{{ .metadata.namespace }}"
                  namespaced: true
                  labels:
                    platform.example.io/environment: "{{ .metadata.name }}"
                spec:
                  indexName: "{{ .spec.search.indexName }}"
                  replicas: "{{ .spec.search.replicas }}"
                hasStatus: false
        emit:
          status:
            fields:
              - path: phase
                value: "Ready"
              - path: activeComponents
                value: "tier={{ .spec.tier }}"

    # ── CacheCluster ───────────────────────────────────────────────────────────
    cachecluster:
      crdFile: ./crd-cachecluster.yaml
      operatorBox:
        reconcile:
          workers: 1
          resync: 60s
          onCreate:
            deployments:
              - image: "redis:7-alpine"
                replicas: 1
                port: 6379
                reconcile: true
            services:
              - port: "6379"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: endpoint
                value: "{{ .metadata.name }}-svc.{{ .metadata.namespace }}.svc.cluster.local:6379"

    # ── SearchIndex ────────────────────────────────────────────────────────────
    searchindex:
      crdFile: ./crd-searchindex.yaml
      operatorBox:
        reconcile:
          workers: 1
          resync: 60s
          onCreate:
            deployments:
              - image: "opensearchproject/opensearch:2.11.0"
                replicas: "{{ .spec.replicas }}"
                port: 9200
                reconcile: true
                env:
                  - name: OPENSEARCH_INDEX
                    value: "{{ .spec.indexName }}"
                  - name: discovery.type
                    value: single-node
            services:
              - port: "9200"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"

