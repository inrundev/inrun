apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: workspace-operator
  author: orkspace
  version: 0.1.0
  description: >
    Workspace operator: demonstrates the simplest possible use of onCreate.custom.
    Creating a Workspace CR automatically provisions a SecretVault child CR.
    The SecretVault operator then creates the underlying Deployment that serves secrets.

spec:
  crds:

    # ── Workspace ─────────────────────────────────────────────────────────────
    # The "parent" CRD. When a Workspace is created, its operatorBox declares
    # a SecretVault child CR via onCreate.custom.
    workspace:
      crdFile: ./crd-workspace.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 60s
          onCreate:
            custom:
              - apiVersion: platform.example.io/v1alpha1
                kind: SecretVault
                metadata:
                  name: "{{ .metadata.name }}-vault"
                  namespace: "{{ .metadata.namespace }}"
                  namespaced: true
                  labels:
                    platform.example.io/workspace: "{{ .metadata.name }}"
                    platform.example.io/team: "{{ .spec.team }}"
                spec:
                  workspaceName: "{{ .metadata.name }}"
                  encryption: "{{ .spec.encryption }}"
                  maxSecrets: 100
                # hasStatus: false — we do not need to read vault status back
                # into the workspace status for this basic example.
                hasStatus: false
        emit:
          status:
            fields:
              - path: phase
                value: "Ready"
              - path: vaultRef
                value: "{{ .metadata.name }}-vault"
        # onCreate.custom — declare child CRs to create when this CR is first seen.
        # Each entry is a full CR spec, with template expressions resolved from the
        # parent Workspace CR's metadata and spec fields.

    # ── SecretVault ───────────────────────────────────────────────────────────
    # The "child" CRD. SecretVault has its own operator that creates a Deployment
    # running the secrets API server. This is a self-contained operator: it does
    # not know it was created by a Workspace. The owner reference set by Orkestra
    # ensures it is deleted when the parent Workspace is deleted.
    secretvault:
      crdFile: ./crd-secretvault.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 60s
          onCreate:
            deployments:
              - image: "hashicorp/vault:1.15"
                replicas: 1
                port: 8443
                reconcile: true
                env:
                  - name: VAULT_WORKSPACE
                    value: "{{ .spec.workspaceName }}"
                  - name: VAULT_ENCRYPTION
                    value: "{{ .spec.encryption }}"
            services:
              - port: "8443"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: endpoint
                value: "{{ .metadata.name }}-svc.{{ .metadata.namespace }}.svc.cluster.local:8443"

