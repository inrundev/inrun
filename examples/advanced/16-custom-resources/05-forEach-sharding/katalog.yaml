apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: shardedstore-operator
  author: orkspace
  version: 0.1.0
  description: >
    ShardedStore operator: demonstrates forEach on custom resource blocks.
    For each entry in spec.shards, Orkestra creates one Shard child CR.
    The shard list can be updated at runtime — new entries are added,
    removed entries cause their Shard CRs to be deleted.

spec:
  crds:

    # ── ShardedStore ───────────────────────────────────────────────────────────
    shardedstore:
      crdFile: ./crd-shardedstore.yaml
      operatorBox:
        reconcile:
          workers: 2
          resync: 60s
          onCreate:
            custom:
              # forEach iterates over .spec.shards. For each element (bound as .shard),
              # Orkestra creates one Shard CR. Template expressions inside the block
              # can reference both the parent CR (via .metadata, .spec) and the current
              # iteration element (via .shard.<field>).
              - apiVersion: storage.example.io/v1alpha1
                kind: Shard
                forEach:
                  field: spec.shards
                  as: shard
                metadata:
                  name: "{{ .metadata.name }}-{{ .shard.name }}"
                  namespace: "{{ .metadata.namespace }}"
                  namespaced: true
                  labels:
                    storage.example.io/store: "{{ .metadata.name }}"
                    storage.example.io/region: "{{ .shard.region }}"
                spec:
                  shardName: "{{ .shard.name }}"
                  region: "{{ .shard.region }}"
                  size: "{{ .shard.size }}"
                  replicationFactor: "{{ .spec.replicationFactor }}"
                hasStatus: false
        emit:
          status:
            fields:
              - path: phase
                value: "Ready"
              - path: shardCount
                value: "{{ len .spec.shards }}"

    # ── Shard ──────────────────────────────────────────────────────────────────
    shard:
      crdFile: ./crd-shard.yaml
      operatorBox:
        reconcile:
          workers: 3
          resync: 60s
          onCreate:
            deployments:
              - image: "redis:7-alpine"
                replicas: "{{ .spec.replicationFactor }}"
                port: 6380
                reconcile: true
                env:
                  - name: SHARD_NAME
                    value: "{{ .spec.shardName }}"
                  - name: SHARD_REGION
                    value: "{{ .spec.region }}"
            services:
              - port: "6380"
        emit:
          status:
            fields:
              - path: phase
                value: "Ready"
              - path: endpoint
                value: "{{ .metadata.name }}.{{ .metadata.namespace }}.svc.cluster.local"

