apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: cross-operator-cross-binary
  description: >
    Cross-CRD communication across two separate Orkestra deployments
    in the same cluster (different namespaces).

    Producer runs in namespace producer-system under its own Orkestra
    deployment. Consumer runs in consumer-system under a second Orkestra
    deployment.

    Consumer uses source.endpoint as an HTTP fallback because the
    Producer informer is not available in-process. Orkestra calls
    the Producer Orkestra's REST API and caches the response for 15s
    to avoid hammering on every resync.

    Deploy order:
      1. kubectl apply -f producer-katalog.yaml  -n producer-system
      2. kubectl apply -f consumer-katalog.yaml  -n consumer-system

    Both files reference this Katalog as their spec source; the difference
    is the namespace and which CRDs each deployment is configured to manage.

spec:
  crds:
    # ── Producer (producer-system deployment) ─────────────────────────────────
    producer:
      apiTypes:
        group: cross.orkestra.io
        version: v1alpha1
        kind: Producer
        plural: producers
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onCreate:
            deployments:
              - image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: 8080
                reconcile: true
            services:
              - port: "8080"
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: endpoint
                value: '{{ get .children.service "spec" "clusterIP" }}:8080'

    # ── Consumer (consumer-system deployment) ─────────────────────────────────
    # source.endpoint is the HTTP fallback used when the Producer informer is
    # not available in-process (cross-binary scenario).
    #
    # Orkestra calls:

    #   GET http://orkestra.producer-system:8080/katalog/producer/cr/<ns>/<name>
    # and caches the result for 15 s between resyncs.
    consumer:
      apiTypes:
        group: cross.orkestra.io
        version: v1alpha1
        kind: Consumer
        plural: consumers
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onCreate:
            deployments:
              - image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: 9090
                env:
                  - name: PRODUCER_HOST
                    value: "{{ .cross.producer.status.endpoint }}"
                reconcile: true
            services:
              - port: "9090"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: producerEndpoint
                value: "{{ .cross.producer.status.endpoint }}"
        observe:
          cross:
            - crd: producer
              selector:
                name: "{{ .metadata.name }}"
                namespace: "{{ .metadata.namespace }}"
              as: producer
              source:
                endpoint: "http://orkestra.producer-system:8080/katalog/producer/cr/{{ .metadata.namespace }}/{{ .metadata.name }}"
                cacheFor: 15s

