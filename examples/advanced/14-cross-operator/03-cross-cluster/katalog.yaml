apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: cross-operator-cross-cluster
  description: >
    Cross-CRD communication across two separate Kind clusters.

    Producer runs in cluster-a, exposed via a NodePort (or LoadBalancer).
    Consumer runs in cluster-b and reads Producer's status.endpoint
    through the cross source.endpoint, which points at cluster-a's
    Orkestra REST API.

    Setup:
      make multi-cluster          # creates cluster-a and cluster-b
      make install CLUSTER=a      # install Orkestra on cluster-a (producer)
      make install CLUSTER=b      # install Orkestra on cluster-b (consumer)
      make apply-producer         # apply Producer CRs in cluster-a
      make apply-consumer         # apply Consumer CRs in cluster-b

    The Producer Orkestra in cluster-a must be reachable from cluster-b.
    In Kind the NodePort approach works; set PRODUCER_ORKESTRA_URL in
    the Makefile to the correct address before running.

spec:
  crds:
    # ── Producer (cluster-a) ──────────────────────────────────────────────────
    producer:
      apiTypes:
        group: cross.orkestra.io
        version: v1alpha1
        kind: Producer
        plural: producers
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onCreate:
            deployments:
              - image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: 8080
                reconcile: true
            services:
              - port: "8080"
                type: NodePort
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: endpoint
                value: '{{ get .children.service "spec" "clusterIP" }}:8080'

    # ── Consumer (cluster-b) ──────────────────────────────────────────────────
    # source.endpoint crosses the cluster boundary via the Producer
    # Orkestra's external URL.  Responses are cached for 30 s.
    consumer:
      apiTypes:
        group: cross.orkestra.io
        version: v1alpha1
        kind: Consumer
        plural: consumers
      operatorBox:
        reconcile:
          workers: 2
          resync: 60s
          onCreate:
            deployments:
              - image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: 9090
                env:
                  - name: PRODUCER_HOST
                    value: "{{ .cross.producer.status.endpoint }}"
                reconcile: true
            services:
              - port: "9090"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: producerEndpoint
                value: "{{ .cross.producer.status.endpoint }}"
        observe:
          cross:
            - crd: producer
              selector:
                name: "{{ .metadata.name }}"
                namespace: "{{ .metadata.namespace }}"
              as: producer
              source:
                endpoint: "http://$PRODUCER_ORKESTRA_URL/katalog/producer/cr/{{ .metadata.namespace }}/{{ .metadata.name }}"
                cacheFor: 30s

