apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: platform-full
  author: orkspace
  version: 0.1.0
  description: >
    Multi-source Komposer: OCI registry pattern + local Katalog + Helm chart.
    Shows the full composition model for a platform team.

# ── Sources ────────────────────────────────────────────────────────────────

imports:
  # OCI registry pattern — versioned, immutable
  # Pull a published operator pattern from the Orkestra registry
  registry:
    - url: ghcr.io/orkspace/orkestra-registry/patterns/katalogs/postgres:v1.0.0
      oci: true
      # auth:
      #   type: bearer
      #   fromEnv: ORK_REGISTRY_TOKEN
      # version is pinned via v1.0.0 — immutable, safe for production

  # Local Katalog — your team's custom CRD
  files:
    - ./website-katalog.yaml

  # Helm chart source — pulls CRD behavior definitions from a chart
  helm:
    - repo: https://github.com/orkspace/orkestra.git
      chart: example
      path: charts/examples/katalog-example
      version: v0.7.9     # ignore to use main branch or add branch name instead
      # auth:
      #   type: bearer
      #   fromEnv: HELM_REPO_TOKEN

# ── Overrides ──────────────────────────────────────────────────────────────
# Environment-specific tuning. Wins over all sources.

spec:
  crds:
    # Override the postgres pattern for production
    postgres:
      # All other postgres behavior inherited from the OCI pattern
      operatorBox:
        reconcile:
          workers: 8
          resync: 30s

    # Override the website operator for production
    website:
      # All other website behavior inherited from the local Katalog
      operatorBox:
        reconcile:
          workers: 6
          resync: 15s

    # Disable the database operator since we now have Postgres
    database:
      enabled: true

