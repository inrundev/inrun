apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: website-production
  author: orkspace
  version: 0.1.0
  description: Production website operator with full policy

spec:
  crds:
    website:
      apiTypes:
        group: demo.orkestra.io
        version: v1alpha1
        kind: Website
        plural: websites
      admission:
        validation:
          rules:
            - field: spec.image
              prefix: "myorg/"
              message: "images must come from the internal registry"
              action: deny
            - field: spec.replicas
              greaterThan: 0
              message: "replicas must be at least 1"
              action: deny
        mutation:
          rules:
            - field: spec.replicas
              default: 2
              valueType: int
            - field: spec.port
              default: "8080"
      operatorBox:
        reconcile:
          onCreate:
            deployments:
              - image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                reconcile: true
            services:
              - port: "80"
                targetPort: "{{ .spec.port }}"
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: readyReplicas
                value: '{{ get .children.deployment "status" "readyReplicas" }}'

