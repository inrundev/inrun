apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: payment-processor
  description: >
    Payment processor — health endpoint disabled to avoid leaking consecutive-fail
    counts and last-error messages to external consumers. Metrics and info remain
    accessible for dashboards and the Control Center.

spec:
  crds:
    payment:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      endpoints:
        health: false
      operatorBox:
        reconcile:
          workers: 3
          resync: 15s
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}-processor"
                image: "nginx:alpine"
                replicas: "2"
                port: "8080"
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "active"

