apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: credentials-rotation
  description: >
    Credentials rotation operator — all per-CRD HTTP endpoints disabled.
    /katalog/credential is not registered; health, info, and CR list return 404.
    The CRD still appears in the top-level /katalog summary count.
    Token is generated once and rotated on schedule — nothing visible from outside.

spec:
  crds:
    credential:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      endpoints:
        enabled: false
      operatorBox:
        reconcile:
          workers: 2
          resync: 60s
          onCreate:
            secrets:
              - name: "{{ .metadata.name }}-token"
                once: true
                rotateAfter: 720h
                data:
                  token: "{{ randomAlphanumeric 32 }}"
                  service: "{{ .spec.service }}"
        emit:
          status:
            fields:
              - path: phase
                value: "active"

