apiVersion: orkestra.orkspace.io/v1
kind: Komposer
metadata:
  name: mixed-operator-pattern
  author: orkspace
  version: 0.1.0
  description: >
    Demonstrates the mixed operator pattern: a dynamic operatorBox, a typed
    hooks operator, and a typed constructor operator running together in one
    Orkestra runtime. Each CRD comes from a different source, but the Komposer
    unifies them into a single runtime katalog with declarative dependencies.
imports:
  files:
    - ./01-hello-website/katalog.yaml
    - ./09-hooks/katalog.yaml
    - ./10-constructor/katalog.yaml
spec:
  crds:
    database:
    website:
      dependsOn:
        database:
          condition: healthy
      operatorBox:
        reconcile:
          workers: 5
    pipeline:
      dependsOn:
        website:
          condition: started
