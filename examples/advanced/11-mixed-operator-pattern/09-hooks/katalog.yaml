apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: database-operator
  author: orkspace
  version: 0.1.0
  description: >
    Typed Go hooks for the Database CRD. Demonstrates apiTypes.location,
    ork generate registry, and OrkestraRegistry usage from Go.

spec:
  crds:
    database:
      apiTypes:
        group: demo.orkestra.io
        version: v1alpha1
        kind: Database
        plural: databases
        object: Database
        objectList: DatabaseList
        # location enables typed mode — the informer decodes API server
        # responses into *apiv1.Database rather than *unstructured.Unstructured.
        # Required when hooks need type-safe struct access.
        # After setting this, run: ork generate registry --file katalog.yaml
        location: github.com/orkspace/orkestra-mixed-operator-pattern/09-hooks/api/v1alpha1
        alias: dbv1alpha1
      operatorBox:
        reconcile:
          default: true   # Generic Reconciler is still used — hooks are additive
          hooks:
            location: github.com/orkspace/orkestra-mixed-operator-pattern/09-hooks/hooks
            function: DatabaseHooks
            alias: dbhooks
            managedResources:          # A list of resources managed by this hook (required for RBAC)
              - kind: StatefulSet
              - kind: Service
              - kind: CronJob
          workers: 3
          resync: 30s
          onCreate:
            serviceAccounts:
              - name: "{{ .metadata.name }}-sa"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: engine
                value: "{{ .spec.engine }}"
              - path: endpoint
                value: "{{ .metadata.name }}-svc.{{ .metadata.namespace }}.svc.cluster.local"
        # The ServiceAccount is declared here — Orkestra creates it before hooks run.
        # The hook references it by the same naming convention: obj.Name + "-sa".
        # Status Layer 1 (Ready condition) is always automatic.
        # Layer 2 fields are still written after the hook completes.

