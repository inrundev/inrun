apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: dependencies-cross-cluster
  description: >
    Startup ordering across two separate Kind clusters.

    Database runs in cluster-a (infrastructure cluster).
    App runs in cluster-b (application cluster).

    App declares dependsOn: database: healthy. Orkestra resolves the
    condition by calling the Database Orkestra's external URL (NodePort).
    Once healthy, the cross block reads the endpoint and injects it.

    Setup:
      make multi-cluster          # creates cluster-a and cluster-b
      make install CLUSTER=a      # install Orkestra in cluster-a
      make install CLUSTER=b      # install Orkestra in cluster-b
      make apply-database         # apply Database CRs in cluster-a
      make apply-app              # apply App CRs in cluster-b

    Set DATABASE_ORKESTRA_URL in the Makefile to cluster-a's NodePort
    address before running.

spec:
  crds:
    # ── Database (cluster-a) ──────────────────────────────────────────────────
    database:
      apiTypes:
        group: deps.orkestra.io
        version: v1alpha1
        kind: Database
        plural: databases
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
          onCreate:
            statefulSets:
              - image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: 5432
                reconcile: true
            services:
              - port: "5432"
                type: NodePort
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: endpoint
                value: "{{ .metadata.name }}.default.svc:5432"
              - path: ready
                value: '{{ get .children.statefulset "status" "readyReplicas" }}'

    # ── App (cluster-b) ────────────────────────────────────────────────────────
    # source.endpoint crosses the cluster boundary to resolve the dependency
    # condition and to fetch the database endpoint for injection.
    app:
      apiTypes:
        group: deps.orkestra.io
        version: v1alpha1
        kind: App
        plural: apps
      dependsOn:
        database: healthy
      operatorBox:
        reconcile:
          workers: 3
          resync: 60s
          onCreate:
            deployments:
              - image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: 8080
                env:
                  - name: DB_HOST
                    value: "{{ .cross.database.status.endpoint }}"
                reconcile: true
            services:
              - port: "80"
                targetPort: "8080"
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: dbEndpoint
                value: "{{ .cross.database.status.endpoint }}"
        observe:
          cross:
            - crd: database
              selector:
                name: "{{ .metadata.name }}"
                namespace: "{{ .metadata.namespace }}"
              as: database
              source:
                endpoint: "http://$DATABASE_ORKESTRA_URL/katalog/database/cr/{{ .metadata.namespace }}/{{ .metadata.name }}"
                cacheFor: 30s

