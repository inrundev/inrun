# https://orkestra.sh/docs/reference/schema/e2e/
apiVersion: orkestra.orkspace.io/v1
kind: E2E
metadata:
  name: webhook-protection-suite
  description: >
    Gateway webhook regression suite — admission webhooks (validation +
    mutation), deletion protection, and namespace restriction enforcement.
    Runs all three in the same cluster.

imports:
  - ./admission/e2e.yaml
  - ./deletion-protection/e2e.yaml
  - ./namespace-protection/e2e.yaml
