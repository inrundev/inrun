apiVersion: orkestra.orkspace.io/v1
kind: Motif
metadata:
  name: reconciler-probe-storage
  description: Storage resources — PersistentVolume, PersistentVolumeClaim.

resources:
  persistentVolumes:
    - name: "{{ .metadata.name }}-pv"
      capacity: 1Gi
      accessModes: [ReadWriteOnce]
      hostPath: "/tmp/orkestra-{{ .metadata.name }}"

  persistentVolumeClaims:
    - name: "{{ .metadata.name }}-pvc"
      namespace: "{{ .metadata.name }}-ns"
      storage: 1Gi
      accessModes: [ReadWriteOnce]
