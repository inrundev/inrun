apiVersion: inrun.dev/v1
kind: Catalog
metadata:
  name: webapp-ctrlruntime
  author: inrundev
  version: 0.1.0
  description: >
    WebApp operator — reconciler written in controller-runtime style.
    The constructor wraps it with domain.ReconcilerFrom and adapter.ToClient
    so it plugs into Inrun without rewriting the reconciler body.

spec:
  crds:
    webapp:
      crdFile: ./crd-webapp.yaml
      crFiles:
        - ./cr-webapp.yaml
      apiTypes:
        group: migration.demo.inrun.dev
        version: v1alpha1
        kind: WebApp
        plural: webapps
        object: WebApp
        objectList: WebAppList
        location: github.com/inrundev/inrun-ctrlruntime-constructor/api/v1alpha1
        alias: webappv1
      operatorBox:
        reconcile:
          default: false
          constructor:
            location: github.com/inrundev/inrun-ctrlruntime-constructor/constructor
            function: NewWebAppReconciler
            alias: webappconstructor
            managedResources:
              - kind: Deployment
          workers: 2
          resync: 30s
        observe:
          watch:
            - apiVersion: v1
              kind: ConfigMap
              index:
                - name: metadata.labels.app
                  field: "metadata.labels.app"
        preReconcile:
          reconcileGate:
            eventAware: true

