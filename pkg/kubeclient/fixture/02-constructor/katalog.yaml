apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: blockchainnode-constructor
  author: orkspace
  version: 0.1.0
  description: >
    BlockchainNode operator — constructor makes the feature-flag HTTP call itself,
    but only during business hours. The Katalog declares the business-hours window
    and the flag URL pattern; the constructor owns the time check and the HTTP call.
    The binary is identical across environments and schedules.

spec:
  crds:
    blockchainnode:
      crdFile: ./crd-node.yaml
      crFiles:
        - ./cr-node.yaml

      apiTypes:
        group: demo.orkestra.io
        version: v1alpha1
        kind: BlockchainNode
        plural: blockchainnodes
        object: BlockchainNode
        objectList: BlockchainNodeList
        location: github.com/orkspace/orkestra-args-constructor/api/v1alpha1
        alias: bcnodev1

      operatorBox:
        reconcile:
          default: false
          constructor:
            location: github.com/orkspace/orkestra-args-constructor/constructor
            function: NewBlockchainNodeReconciler
            alias: bnconstructor
            managedResources:
              - kind: Deployment
            args:
              flagUrl: '{{ .spec.serviceUrl }}/flags/{{ .metadata.name }}/v2Enabled'
              businessHoursStart: "09:00"
              businessHoursEnd: "18:00"
          workers: 2
          resync: 30s
