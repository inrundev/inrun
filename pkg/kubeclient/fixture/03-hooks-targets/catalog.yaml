apiVersion: inrun.dev/v1
kind: Catalog
metadata:
  name: blockchainappwithtargets-hooks
  author: inrundev
  version: 0.1.0
  description: >
    BlockchainAppWithTargets — same hook binary as 01-hooks, but the feature
    flag value comes from the target surface rather than a live HTTP call.
    "v2-enabled" forces featureEnabled=true; "v2-disabled" forces it false.

notes:
  functions:
    - name: inBusinessHours
      description: True on weekdays between 09:00–18:00 UTC
      expression: '{{ and weekday (timeInWindow "09:00" "18:00") }}'

gateway:
  enabled: true
  api:
    enabled: true
    auth:
      tokens:
        - name: dev
          secretRef:
            name: inrun-dev-token
            namespace: default
            key: token

spec:
  crds:
    blockchainappwithtargets:
      crdFile: ./crd.yaml
      apiTypes:
        group: demo.inrun.dev
        version: v1alpha1
        kind: BlockchainAppWithTargets
        plural: blockchainappwithtargets
        object: BlockchainAppWithTargets
        objectList: BlockchainAppWithTargetsList
        location: github.com/inrundev/inrun-args-hooks-targets/api/v1alpha1
        alias: bcappwithtargetsv1
      serve:
        enabled: true
        namespace: default
        tokens:
          dev:
            permissions:
              resources:
                - create
                - update
        fields:
          image:
            label: "Container image"
            required: true
          network:
            label: "Network"
            required: true
          nodeType:
            label: "Node type"
          replicas:
            label: "Replicas"
        target:
          v2-enabled:
            primary: true
            operatorBox:
              preReconcile:
                enqueueGate:
                  when:
                    - field: '{{ inBusinessHours }}'
                      equals: "true"
              reconcile:
                hooks:
                  location: github.com/inrundev/inrun-args-hooks-targets/hooks
                  function: BlockchainAppHooks
                  alias: bchooks
                  managedResources:
                    - kind: Deployment
                  args:
                    featureEnabled: "true"
                    inBusinessHours: '{{ inBusinessHours }}'

          v2-disabled:
            operatorBox:
              reconcile:
                hooks:
                  location: github.com/inrundev/inrun-args-hooks-targets/hooks
                  function: BlockchainAppHooks
                  alias: bchooks
                  managedResources:
                    - kind: Deployment
                  args:
                    featureEnabled: "false"
                    inBusinessHours: '{{ inBusinessHours }}'

          v2-ctor:
            operatorBox:
              reconcile:
                default: false
                constructor:
                  location: github.com/inrundev/inrun-args-hooks-targets/constructor
                  function: NewBlockchainAppWithTargetsReconciler
                  alias: bcctor
                  args:
                    featureEnabled: "true"
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: featureEnabled
                value: "{{ .external.flags.body }}"
                when:
                  - field: external.flags.called
                    equals: "true"

