apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: remote-auth-test
  version: 0.1.0
  description: Validates remote reconciler auth.secretRef with namespace set.
spec:
  crds:
    widget:
      crdFile: ../../testdata/validate/crd.yaml
      operatorBox:
        reconcile:
          default: false
          remote:
            endpoint: "http://localhost:8025/reconcile"
            auth:
              secretRef:
                name: reconciler-token
                namespace: default
                key: token
            managedResources:
              - group: apps
                plural: deployments
