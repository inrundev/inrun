# Triggers: autoscale.profile combined with manual fields
apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: bad-autoscale-profile
  version: 0.1.0
  description: Tests that autoscale.profile cannot be combined with manual autoscale fields.
spec:
  crds:
    widget:
      crdFile: ../crd.yaml
      operatorBox:
        runtime:
          autoscale:
            profile: steady
            interval: 30s

