# Triggers: duplicate watch entry (same apiVersion + kind)
apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: bad-watch-duplicate
  version: 0.1.0
  description: watch declares the same resource twice.
spec:
  crds:
    widget:
      crdFile: ../crd.yaml
      operatorBox:
        observe:
          watch:
            - apiVersion: apps/v1
              kind: Deployment
            - apiVersion: apps/v1
              kind: Deployment

