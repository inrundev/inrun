apiVersion: orkestra.orkspace.io/v1
kind: Katalog
metadata:
  name: test
spec:
  crds:
    platform:
      apiTypes:
        group: platform.orkestra.io
        version: v1alpha1
        kind: Platform
        plural: platforms
      admission:
        validation:
          include: ./validation-rules.yaml
          rules:
            - field: spec.replicas
              operator: lte
              value: "10"
              message: "replicas must not exceed 10"
              action: deny

